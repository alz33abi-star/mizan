<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prudence">
<meta name="application-name" content="Prudence">
<meta name="format-detection" content="telephone=no">
<meta id="themeColor" name="theme-color" content="#F2F2F7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Prudence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F7F7FA;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.2);
  --text:#101418;--text2:#6B7280;--text3:#9CA3AF;--sep:rgba(60,60,67,.18);
  --accent:#94702F;--accentSoft:rgba(148,112,47,.13);--onAccent:#FFFFFF;
  --hero:#1F1F22;--heroText:#F6F2E8;--heroSub:rgba(246,242,232,.68);--gold:#D9AA55;
  --inc:#15935A;--incSoft:rgba(21,147,90,.12);--exp:#D9434B;--expSoft:rgba(217,67,75,.11);
  --tr:#2F6FDB;--trSoft:rgba(47,111,219,.12);--warn:#C98309;--warnSoft:rgba(201,131,9,.14);
  --tabbar:rgba(249,249,251,.86);--shadow:0 1px 2px rgba(16,20,24,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--card:#1C1C1E;--card2:#232326;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.34);
    --text:#F4F5F7;--text2:#A1A1AA;--text3:#71717A;--sep:rgba(84,84,88,.6);
    --accent:#8FC29E;--accentSoft:rgba(143,194,158,.16);--onAccent:#10231A;
    --hero:#1B3024;--heroText:#F3EFE4;--heroSub:rgba(243,239,228,.62);--gold:#E6BC6A;
    --inc:#34C77B;--incSoft:rgba(52,199,123,.15);--exp:#FF6B70;--expSoft:rgba(255,107,112,.14);
    --tr:#5B93F5;--trSoft:rgba(91,147,245,.16);--warn:#F2A93B;--warnSoft:rgba(242,169,59,.16);
    --tabbar:rgba(22,22,24,.86);--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1C1C1E;--card2:#232326;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.34);
  --text:#F4F5F7;--text2:#A1A1AA;--text3:#71717A;--sep:rgba(84,84,88,.6);
  --accent:#8FC29E;--accentSoft:rgba(143,194,158,.16);--onAccent:#10231A;
  --hero:#1B3024;--heroText:#F3EFE4;--heroSub:rgba(243,239,228,.62);--gold:#E6BC6A;
  --inc:#34C77B;--incSoft:rgba(52,199,123,.15);--exp:#FF6B70;--expSoft:rgba(255,107,112,.14);
  --tr:#5B93F5;--trSoft:rgba(91,147,245,.16);--warn:#F2A93B;--warnSoft:rgba(242,169,59,.16);
  --tabbar:rgba(22,22,24,.86);--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);overscroll-behavior-y:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
.remind{display:flex;align-items:center;gap:12px;background:var(--warnSoft);border-radius:14px;padding:12px 14px;margin-top:12px}
.remind .grow{font-size:14px}
.remind b{display:block;font-size:15px}
body{font-family:"IBM Plex Sans Arabic",-apple-system,"SF Arabic","Geeza Pro",Tahoma,sans-serif;font-size:16px;line-height:1.45;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:bidi-override;display:inline-block}
.page{max-width:680px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 24px;display:none}
.page.active{display:block}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 2px 12px}
.top h1{font-size:32px;line-height:1.15;font-weight:700;margin:0}
.brand{display:flex;align-items:center;gap:10px}
.brand img{border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.12);flex:none}
.brand-name{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:34px!important;letter-spacing:.2px;text-align:right}
.top .sub{color:var(--text2);font-size:14px;margin-top:2px}
.actions{display:flex;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--fill);border:0;color:var(--accent);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.solid{background:var(--accent);color:var(--onAccent)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:24px 4px 8px}
.section-h h2{font-size:20px;margin:0;font-weight:700}
.link{background:none;border:0;color:var(--accent);font-size:15px;padding:4px 0}
.group{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;position:relative;width:100%;background:none;border:0;text-align:start}
button.row:active{background:var(--fill)}
.row+.row::before{content:"";position:absolute;top:0;right:66px;left:0;height:1px;transform:scaleY(.5);background:var(--sep)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.grow{flex:1;min-width:0}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{color:var(--text2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;white-space:nowrap}
.pos{color:var(--inc)}.neg{color:var(--exp)}.trc{color:var(--tr)}
.chev{color:var(--text3);width:16px;height:16px;flex:none}
.empty{padding:28px 18px;text-align:center;color:var(--text2)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--accent);color:var(--onAccent)}
.btn.ghost{background:var(--accentSoft);color:var(--accent)}
.btn.danger{background:var(--expSoft);color:var(--exp)}
.btn.block{width:100%}

/* hero */
.hero{background:var(--hero);color:var(--heroText);border-radius:22px;padding:20px 20px 18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -70px auto;width:210px;height:210px;border-radius:50%;
  border:28px solid rgba(255,255,255,.05)}
.hero .lbl{color:var(--heroSub);font-size:14px}
.hero .big{font-size:40px;font-weight:700;line-height:1.1;margin:6px 0 2px;letter-spacing:-.5px}
.hero .big small{font-size:18px;font-weight:500;color:var(--heroSub);margin-inline-start:6px}
.hero .meta{display:flex;gap:16px;margin-top:14px;font-size:13px;color:var(--heroSub);position:relative;z-index:1}
.hero .meta b{color:var(--heroText);font-weight:600}
.scale{margin-top:16px;position:relative;z-index:1}
.scale .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;overflow:hidden;gap:3px}
.scale .bar i{display:block;height:100%}
.scale .legend{display:flex;justify-content:space-between;font-size:12px;color:var(--heroSub);margin-top:6px}

.monthnav{display:flex;align-items:center;gap:6px}
.monthnav button{width:30px;height:30px;border-radius:50%;border:0;background:var(--fill);color:var(--text)}
.monthnav span{font-weight:600;min-width:112px;text-align:center;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);min-width:0}
.tile .k{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px}
.tile .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tile .v{font-size:17px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.budget{background:var(--card);border-radius:14px;padding:14px;margin-top:8px;box-shadow:var(--shadow)}
.budget .head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.progress{height:8px;border-radius:8px;background:var(--fill);overflow:hidden}
.progress i{display:block;height:100%;border-radius:8px;background:var(--accent);transition:width .4s}

/* search & filters */
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 10px;height:40px}
.search svg{width:18px;height:18px;color:var(--text2);flex:none}
.search input{border:0;background:none;outline:none;flex:1;height:100%;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--card);color:var(--text);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;box-shadow:var(--shadow)}
.chip.on{background:var(--text);color:var(--bg)}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.selwrap{position:relative}
.selwrap select,.selwrap input{width:100%;appearance:none;-webkit-appearance:none;border:0;background:var(--card);border-radius:10px;padding:8px 10px;font-size:14px;height:38px;box-shadow:var(--shadow)}
.day-h{display:flex;justify-content:space-between;color:var(--text2);font-size:13px;margin:18px 6px 6px}
.stat-line{display:flex;gap:8px;margin-top:10px}
.stat-line div{flex:1;background:var(--card);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--text2);box-shadow:var(--shadow)}
.stat-line b{display:block;font-size:16px;color:var(--text)}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 6px;font-size:14px;font-weight:500;color:var(--text)}
.seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12);font-weight:600}

/* debts */
.debt{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);width:100%;border:0;text-align:start;display:block;margin-bottom:10px}
.debt:active{opacity:.85}
.debt .hd{display:flex;align-items:center;gap:12px}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.b-late{background:var(--expSoft);color:var(--exp)}
.b-soon{background:var(--warnSoft);color:var(--warn)}
.b-ok{background:var(--fill);color:var(--text2)}
.b-done{background:var(--incSoft);color:var(--inc)}
.debt .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;font-size:12px;color:var(--text2)}
.debt .nums b{display:block;font-size:15px;color:var(--text);font-weight:600}
.debt .progress{margin-top:12px}
.dsum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dsum .tile .v{font-size:20px}

.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none;margin:0;transition:background .2s;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:#34C759}
.field input.switch{flex:none;padding:0;min-width:51px}
.switch:checked::after{transform:translateX(-20px)}
.srow{display:grid;grid-template-columns:1.2fr 1fr 34px;gap:8px;align-items:center;padding:8px 14px;position:relative}
.srow+.srow::before{content:"";position:absolute;top:0;right:14px;left:0;height:1px;transform:scaleY(.5);background:var(--sep)}
.srow input{border:0;background:var(--fill);border-radius:8px;padding:8px;font-size:15px;min-width:0;width:100%;outline:none}
.srow .x{border:0;background:none;color:var(--exp);font-size:22px;line-height:1}
.auto{font-size:12px;font-weight:600;color:var(--tr);white-space:nowrap}
div.row[data-act]{cursor:pointer}
div.row[data-act]:active{background:var(--fill)}
.paybtn{border:0;background:var(--accentSoft);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;flex:none}
.dues-sum{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--text2);margin:10px 4px 8px}
.dues-sum b{color:var(--text)}
.subh{font-size:13px;color:var(--text2);padding:10px 14px 4px}
.hsec>.hero{margin-top:16px}
#hsecs>.hsec:first-child>.hero{margin-top:4px}
#hsecs>.hsec:first-child>.section-h{margin-top:8px}
.customize{display:block;margin:26px auto 0;background:var(--card);border:0;border-radius:999px;padding:9px 18px;color:var(--accent);font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.pri{min-width:34px;height:26px;border-radius:8px;display:inline-grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:1px;flex:none;padding:0 6px}
.p1{background:var(--incSoft);color:var(--inc)}.p2{background:var(--warnSoft);color:var(--warn)}.p3{background:var(--expSoft);color:var(--exp)}
.seg button.prio1{color:var(--inc)}.seg button.prio2{color:var(--warn)}.seg button.prio3{color:var(--exp)}
.seg button.prio1.on{background:var(--inc);color:#fff}.seg button.prio2.on{background:var(--warn);color:#fff}.seg button.prio3.on{background:var(--exp);color:#fff}
.donebtn{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);background:none;color:var(--accent);flex:none;font-size:15px;font-weight:700;display:grid;place-items:center;padding:0}
.donebtn.on{background:var(--accent);color:var(--onAccent)}
.row.done .t1{text-decoration:line-through;color:var(--text2)}
.palettes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.pal{border:0;background:var(--card);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;box-shadow:var(--shadow)}
.pal .sw2{width:34px;height:34px;border-radius:50%;position:relative;overflow:hidden}
.pal .sw2 i{position:absolute;inset:0 50% 0 0}
.pal.on{outline:2px solid var(--accent)}
.lrow{display:flex;align-items:center;gap:8px;padding:8px 12px;position:relative}
.lrow+.lrow::before{content:"";position:absolute;top:0;right:12px;left:0;height:1px;transform:scaleY(.5);background:var(--sep)}
.lrow .mv{width:34px;height:34px;border-radius:10px;border:0;background:var(--fill);color:var(--text);font-size:16px}
.lrow .mv:disabled{opacity:.3}
.qchips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px}
.qchips .chip{padding:5px 11px;font-size:13px;background:var(--fill);box-shadow:none}
.home-top{display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand brand" "side actions";align-items:end;gap:14px 10px;padding-top:18px}
.home-top .ht-center{grid-area:brand;text-align:center}
.home-top .ht-side{grid-area:side;min-width:0}
.home-top .actions{grid-area:actions;justify-self:end;align-self:center}
.ht-date{font-size:14px;font-weight:600;color:var(--text)}
.ht-dua{font-size:12.5px;line-height:1.55;color:var(--text2);margin-top:2px}
.ht-center .brand-name{text-align:center!important;font-size:36px!important;line-height:1}
.ht-sub{font-size:12.5px;color:var(--text2);margin-top:4px}
.aed{height:.8em;width:.92em;vertical-align:-.06em;fill:currentColor;display:inline-block;overflow:visible}
.qchips .chip.on{background:var(--text);color:var(--bg)}
/* reports */
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-top:12px}
.card h3{margin:0 0 2px;font-size:17px}
.card .hint{color:var(--text2);font-size:13px;margin-bottom:12px}
.chartbox{position:relative;height:230px}
.chartbox.sq{height:220px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.leg{margin-top:12px}
.leg .li{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.leg .li+.li{border-top:1px solid var(--sep)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}

/* tab bar */
.tabbar{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--tabbar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--sep);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--text3);font-size:11px;font-weight:500}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}

/* sheet */
.overlay{position:fixed;inset:0;z-index:50;display:none}
.overlay.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:fade .2s ease}
.sheet-panel{position:absolute;inset:auto 0 0 0;max-width:680px;margin:0 auto;background:var(--bg);border-radius:14px 14px 0 0;
  max-height:94vh;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:7px auto 0}
.sheet-head{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;padding:6px 12px 8px}
.sheet-head h3{margin:0;text-align:center;font-size:17px;font-weight:600}
.txtbtn{border:0;background:none;color:var(--accent);font-size:16px;padding:6px 4px;text-align:start}
.txtbtn.strong{font-weight:700;text-align:end}
.sheet-body{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.field-group{background:var(--card);border-radius:12px;overflow:hidden;margin-top:14px}
.field{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:48px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;right:14px;left:0;height:1px;transform:scaleY(.5);background:var(--sep)}
.field label{width:98px;flex:none;color:var(--text);font-size:15px}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;padding:12px 0;text-align:start}
.field select{appearance:none;-webkit-appearance:none}
.field textarea{resize:none;min-height:70px}
.flabel{color:var(--text2);font-size:13px;margin:16px 14px 6px}
.amount-in{background:var(--card);border-radius:14px;margin-top:14px;padding:14px;text-align:center}
.amount-in input{border:0;background:none;outline:none;text-align:center;font-size:40px;font-weight:700;width:100%;direction:ltr}
.amount-in>span{color:var(--text2);font-size:14px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.cat{border:0;background:var(--card);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.cat .e{font-size:22px}
.cat.on{outline:2px solid var(--accent);background:var(--accentSoft)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px}
.sw{width:32px;height:32px;border-radius:50%;border:0}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--text)}
.emojis{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}
.em{width:44px;height:44px;border-radius:12px;border:0;background:var(--fill);font-size:22px}
.em.on{outline:2px solid var(--accent)}
.note{font-size:13px;color:var(--text2);margin:8px 14px 0}
.btns{display:grid;gap:8px;margin-top:20px}
.dstats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
textarea.code{width:100%;min-height:120px;border:0;border-radius:12px;background:var(--card);padding:12px;font-size:12px;direction:ltr;font-family:ui-monospace,Menlo,monospace}

/* dialog + toast */
.dialog{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);padding:24px}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:90;
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

const REP={none:'لا يتكرر',weekly:'أسبوعي',biweekly:'كل أسبوعين',monthly:'شهري',quarterly:'كل 3 أشهر',yearly:'سنوي'};
const isRec=r=>r.repeat&&r.repeat!=='none';

function processAutoRem(){
  let n=0;const t0=today();
  for(const r of (S.reminders||[])){
    if(!r.auto||r.done||r.dueMode!=='date'||!walletById(r.autoWalletId))continue;
    for(let g=0;g<24;g++){
      if(r.done||!r.date||r.date>t0||r.date<(r.autoFrom||t0))break;
      const amount=r2(+r.amount||0);if(!(amount>0))break;
      const inc=isInc(r);
      const t={id:uid(),type:inc?'income':'expense',amount,category:r.category,walletId:r.autoWalletId,date:r.date,
        note:(inc?'إيداع تلقائي: ':'خصم تلقائي: ')+r.title,reminderId:r.id,auto:true};
      S.txs.push(t);
      r.history=r.history||[];r.history.push({id:uid(),date:r.date,amount,txId:t.id,due:r.date,auto:true});
      n++;
      if(isRec(r))advanceRem(r);else{r.done=true;r.doneDate=t.date;r.txId=t.id}
    }
  }
  return n;
}
function advanceRem(r,dir=1){
  if(r.dueMode==='date'&&r.date)r.date=addPeriod(r.date,r.repeat,dir);
  else if(r.dueMode==='month'&&r.month)r.month=shiftMonth(r.month,dir*({quarterly:3,yearly:12}[r.repeat]||1));
  if(dir>0){
    stepAdvance(r);
    const nd=r.dueMode==='date'?r.date:(r.month?periodStart(r.month):'');
    if(r.until&&nd&&nd>r.until){r.done=true;r.doneDate=today();r.finished=true}
  }
}

  const e=h[idx];if(e.txId)S.txs=S.txs.filter(t=>t.id!==e.txId);h.splice(idx,1);
  if(isRec(r)){if(idx===h.length&&e.due){if(r.dueMode==='date')r.date=e.due;else if(r.dueMode==='month')r.month=e.due}}

/* ============ storage ============ */
const KEY='mizan-finance-v1';
let S;
function blank(){return {version:1,settings:{theme:'auto',palette:'gold',currency:'AED_SYM',budget:0,firstUse:today(),lastBackup:'',symMigrated:true},wallets:[],txs:[],debts:[],reminders:[],categories:null}}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.wallets))return normalize(d)}}catch(e){}
  return seed();
}
function normalize(d){
  const b=blank();
  if(d.settings&&!d.settings.symMigrated){if(['ر.س','د.إ','AED','درهم',''].includes(d.settings.currency||''))d.settings.currency='AED_SYM';d.settings.symMigrated=true}
  return {version:1,settings:{...b.settings,...(d.settings||{})},wallets:d.wallets||[],txs:d.txs||[],
    debts:(d.debts||[]).map(migrateDebt),reminders:d.reminders||[],categories:d.categories||null};
}
function migrateDebt(x){
  const d={payments:[],schedule:[],openingPaid:0,freq:'monthly',autoPay:false,autoWalletId:'',autoFrom:'',...x};
  d.payments=d.payments||[];d.schedule=d.schedule||[];
  if(!d.plan){
    const n=+d.installments||0;
    if(n>0){d.plan='inst';d.instAmount=Math.round(d.total/n*100)/100;d.firstDue=d.startDate||today()}
    else d.plan='once';
  }
  if(!d.createdAt)d.createdAt=d.startDate||today();
  return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('تعذّر الحفظ في ذاكرة الجهاز، صدّر نسخة احتياطية من الإعدادات')}}

function seed(){
  const d=blank();
  let sd=11;const rnd=()=>(sd=(sd*9301+49297)%233280)/233280;

/* ============ calculations ============ */
function balances(upTo){
  const b={};S.wallets.forEach(w=>b[w.id]=+w.initial||0);
  for(const t of S.txs){
    if(upTo&&t.date>upTo)continue;const a=+t.amount||0;
    if(t.type==='income'){if(t.walletId in b)b[t.walletId]+=a}
    else if(t.type==='expense'){if(t.walletId in b)b[t.walletId]-=a}
    else{if(t.walletId in b)b[t.walletId]-=a;if(t.toWalletId in b)b[t.toWalletId]+=a}
  }
  return b;
}
const totalBalance=upTo=>Object.values(balances(upTo)).reduce((a,x)=>a+x,0);
function monthTotals(mk){
  let inc=0,exp=0;const cats={};
  for(const t of S.txs){if(!inPeriod(t.date,mk))continue;
    if(t.type==='income')inc+=+t.amount;
    else if(t.type==='expense'){exp+=+t.amount;cats[t.category]=(cats[t.category]||0)+ +t.amount}}
  return {inc,exp,cats};
}
const FREQ={monthly:'شهري',weekly:'أسبوعي',biweekly:'كل أسبوعين',quarterly:'كل 3 أشهر',yearly:'سنوي'};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
function addPeriod(s,freq,k){
  if(freq==='weekly')return addDays(s,7*k);if(freq==='biweekly')return addDays(s,14*k);
  if(freq==='quarterly')return addMonths(s,3*k);if(freq==='yearly')return addMonths(s,12*k);return addMonths(s,k);
}
const r2=n=>Math.round(n*100)/100;
function stepAdvance(o){
  const steps=o.steps||[];if(!steps.length)return null;
  const s=steps[0];s.after=(+s.after||0)-1;
  if(s.after<=0){const v=r2(+s.amount||0);steps.shift();if(o.instAmount!=null)o.instAmount=v;else o.amount=v;return v}
  return null;
}
function stepsText(o){
  const steps=(o.steps||[]).filter(s=>+s.after>0&&+s.amount>0);if(!steps.length)return '';
  return steps.map(s=>`بعد ${fmtN(+s.after,false)} → ${money(+s.amount)}`).join(' · ');
}
const sortedSched=d=>[...(d.schedule||[])].filter(x=>x.date&&+x.amount>0).sort((a,b)=>a.date.localeCompare(b.date));
const EXTRA_EXCLUDE=['راتب','تحصيل ديون'];
const extraPct=()=>{const v=S.settings.extraPct;return v==null?100:Math.max(0,Math.min(100,+v||0))};
function budgetFor(key){
  const base=+S.settings.budget||0;let extra=0;
  for(const t of S.txs){if(t.type==='income'&&!EXTRA_EXCLUDE.includes(t.category)&&inPeriod(t.date,key))extra+=+t.amount||0}
  const added=base?r2(extra*extraPct()/100):0;
  return {base,extra,added,total:base+added};
}
function fmtPct(p){const r=Math.round(p);if(p>100&&r<=100)return (Math.floor(p*10)/10).toFixed(1);if(p<100&&r>=100)return (Math.floor(p*10)/10).toFixed(1);return String(r)}
function debtInfo(d){
  const total=+d.total||0;const opening=+d.openingPaid||0;
  const payPaid=d.payments.reduce((a,p)=>a+(+p.amount||0),0);
  const paid=opening+payPaid;const remaining=Math.max(0,r2(total-paid));const done=remaining<=0.009;
  let next=null,dueAmount=0,instLeft=0,endDate=null,paidCount=0;const amt=+d.instAmount||0;
  if(d.plan==='inst'&&amt>0){
    paidCount=Math.floor((payPaid+0.01)/amt);
    instLeft=done?0:Math.ceil((remaining-0.01)/amt);
    if(!done&&d.firstDue){next=addPeriod(d.firstDue,d.freq,paidCount);dueAmount=Math.min(r2(amt*(paidCount+1)-payPaid),remaining);
      endDate=addPeriod(d.firstDue,d.freq,paidCount+instLeft-1)}
  }else if(d.plan==='sched'){
    let cum=0;for(const x of sortedSched(d)){cum+=+x.amount;if(cum>payPaid+0.01){next=x.date;dueAmount=Math.min(r2(cum-payPaid),remaining);break}}
    const all=sortedSched(d);endDate=all.length?all[all.length-1].date:null;
    if(done)next=null;
  }else if(!done){next=d.dueDate||null;dueAmount=remaining;endDate=d.dueDate||null}
  const days=next?daysBetween(today(),next):null;
  return {total,paid,opening,payPaid,remaining,amt,paidCount,instLeft,next,dueAmount,endDate,days,done,pct:total?Math.min(100,paid/total*100):0};
}
function debtDues(d,until){
  const i=debtInfo(d);const out=[];if(i.done)return out;let left=i.remaining;
  if(d.plan==='inst'&&i.amt>0&&d.firstDue){
    let k=i.paidCount;let first=true;
    for(let g=0;g<400&&left>0.009;g++,k++){
      const date=addPeriod(d.firstDue,d.freq,k);if(until&&date>until)break;
      const a=r2(first?i.dueAmount:Math.min(i.amt,left));out.push({date,amount:a});left-=a;first=false;
    }
  }else if(d.plan==='sched'){
    let cum=0;
    for(const x of sortedSched(d)){
      const prev=cum;cum+=+x.amount;if(cum<=i.payPaid+0.01)continue;if(left<=0.009)break;
      if(until&&x.date>until){left=0;break}
      const a=r2(Math.min(cum-Math.max(prev,i.payPaid),left));out.push({date:x.date,amount:a});left-=a;
    }
    if(left>0.009)out.push({date:null,amount:r2(left)});
  }else{
    if(d.dueDate){if(!until||d.dueDate<=until)out.push({date:d.dueDate,amount:left})}
    else out.push({date:null,amount:left});
  }
  return out;
}
function debtBadge(i){
  if(i.done)return '<span class="badge b-done">مسدَّد</span>';
  if(i.days==null)return '<span class="badge b-ok">بلا موعد</span>';
  if(i.days<0)return `<span class="badge b-late">متأخر ${fmtN(-i.days,false)} يوم</span>`;
  if(i.days===0)return '<span class="badge b-soon">يستحق اليوم</span>';
  if(i.days<=7)return `<span class="badge b-soon">بعد ${fmtN(i.days,false)} ${i.days<=10&&i.days>2?'أيام':'يوم'}</span>`;
  return `<span class="badge b-ok">${dateStr(i.next)}</span>`;
}
function relDays(n){
  if(n==null)return 'بدون تاريخ محدد';
  if(n<0)return `<span class="neg">متأخر ${fmtN(-n,false)} يوم</span>`;
  if(n===0)return '<span style="color:var(--warn)">اليوم</span>';
  if(n===1)return 'غدًا';
  return `بعد ${fmtN(n,false)} ${n<=10?'أيام':'يوم'}`;
}
function processAutoPay(){
  let n=0;const t0=today();
  for(const d of S.debts){

    for(let g=0;g<120;g++){

      S.txs.push(t);d.payments.push({id:uid(),amount:t.amount,date:t.date,txId:t.id,auto:true});stepAdvance(d);n++;

}

function remStatus(r){
  const t0=today();
  if(r.dueMode==='date'&&r.date){const n=daysBetween(t0,r.date);return {n,due:r.date,late:n<0,text:`${dateStr(r.date)} · ${relDays(n)}`}}
  if(r.dueMode==='month'&&r.month){
    const cm=curPeriod();
    if(r.month<cm)return {n:-1,due:periodEnd(r.month),late:true,text:`<span class="neg">متأخر · كان خلال ${periodName(r.month)}</span>`};
    const n=daysBetween(t0,periodEnd(r.month));
    if(r.month===cm)return {n,due:periodEnd(r.month),late:false,text:n===0?'<span style="color:var(--warn)">هذا الشهر · آخر يوم</span>':`هذا الشهر · متبقٍ ${fmtN(n,false)} ${n<=10&&n>2?'أيام':'يوم'}`};
    return {n,due:periodEnd(r.month),late:false,text:r.month===shiftMonth(cm,1)?`الشهر القادم · ${periodName(r.month)}`:`خلال ${periodName(r.month)}`};
  }
  return {n:null,due:null,late:false,text:'بدون موعد'};
}
function sortReminders(list){
  return [...list].sort((a,b)=>{
    if(!!a.done!==!!b.done)return a.done?1:-1;
    if(a.done)return (b.doneDate||'').localeCompare(a.doneDate||'');
    const sa=remStatus(a),sb=remStatus(b);
    if(sa.late!==sb.late)return sa.late?-1:1;
    if((b.priority||1)!==(a.priority||1))return (b.priority||1)-(a.priority||1);
    return (sa.due||'9999').localeCompare(sb.due||'9999');
  });
}

function forecast(key){
  const start=periodStart(key),end=periodEnd(key);const t0=today();
  const minP=+S.settings.forecastPri||1;
  let income=0,bills=0,inst=0;
  (S.reminders||[]).filter(r=>!r.done).forEach(r=>{
    const st=remStatus(r);if(!st.due)return;
    if(isInc(r)){if(st.due>=start&&st.due<=end)income+=+r.amount||0}
    else if(st.due<=end&&(r.priority||1)>=minP)bills+=+r.amount||0;
  });
  S.debts.filter(d=>d.kind==='owe').forEach(d=>debtDues(d,end).forEach(x=>{if(x.date)inst+=x.amount}));
  return {start,end,income,bills,inst,left:r2(income-bills-inst)};
}

  <div class="card"><h3>المصروفات حسب التصنيف</h3><div class="hint">خلال الفترة المحددة</div>
    ${catList.length?`<div class="chartbox sq"><canvas id="c2"></canvas></div><div class="leg">${catList.map(([k,v])=>{const m=catMeta('expense',k);return `<div class="li"><span class="dot" style="background:${m.c}"></span><span class="grow">${m.i} ${esc(k)}</span><span class="t2 num">${fmtN(v/tExp*100,false)}%</span><b style="min-width:92px;text-align:end">${money(v,{dec:false})}</b></div>`}).join('')}</div>`:'<div class="empty">لا مصروفات في هذه الفترة</div>'}

  if(base&&$('#c3')){
    const entries=Object.entries(cm.cats).sort((a,b)=>b[1]-a[1]);const left=Math.max(0,base-cm.exp);
    charts.push(new Chart($('#c3'),{type:'doughnut',data:{labels:[...entries.map(e=>e[0]),left?'متبقٍ':'—'],datasets:[{data:[...entries.map(e=>e[1]),left],backgroundColor:[...entries.map(e=>catMeta('expense',e[0]).c),fill],borderColor:card,borderWidth:3}]},
      options:{maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'right',rtl:true,labels:{usePointStyle:true,boxWidth:8,padding:10}},tooltip:{rtl:true,callbacks:{label:c=>` ${c.label}: ${fmtN(c.parsed)} ${cur()} (${fmtN(c.parsed/base*100,false)}%)`}}}}}));
  }
  charts.push(new Chart($('#c4'),{type:'line',data:{labels,datasets:[{label:'الرصيد',data:balSeries,borderColor:acc,backgroundColor:acc+'22',fill:true,tension:.35,pointRadius:3,pointBackgroundColor:acc}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tip},scales}}));
  charts.push(new Chart($('#c5'),{type:'line',data:{labels,datasets:[
    {label:'عليّ',data:debtSeries('owe'),borderColor:exp,backgroundColor:exp,tension:.3,pointRadius:3},
    {label:'لي',data:debtSeries('lend'),borderColor:inc,backgroundColor:inc,tension:.3,pointRadius:3,borderDash:[5,4]}]},
    options:{maintainAspectRatio:false,plugins:{legend,tooltip:tip},scales}}));
}

/* ============ sheets / dialogs ============ */
function openSheet({title,body,saveLabel='حفظ',onSave,onMount,noSave}){
  const ov=$('#sheet');
  ov.innerHTML=`<div class="sheet-bg" data-close></div><div class="sheet-panel" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="grab"></div>
    <div class="sheet-head"><button class="txtbtn" data-close>${noSave?'إغلاق':'إلغاء'}</button><h3>${esc(title)}</h3>${noSave?'<span></span>':`<button class="txtbtn strong" id="sheetSave">${saveLabel}</button>`}</div>
    <div class="sheet-body">${body}</div></div>`;
  ov.classList.add('open');document.body.style.overflow='hidden';
  $$('[data-close]',ov).forEach(b=>b.onclick=closeSheet);
  if(!noSave)$('#sheetSave').onclick=()=>{if(onSave()!==false)closeSheet()};
  if(onMount)onMount(ov);
}
function closeSheet(){const ov=$('#sheet');ov.classList.remove('open');ov.innerHTML='';document.body.style.overflow=''}
function confirmBox(title,msg,okLabel,onOk){
  const d=$('#dialog');
  d.innerHTML=`<div class="box" role="alertdialog"><p><b>${esc(title)}</b>${esc(msg)}</p><div class="dbtns"><button data-no>إلغاء</button><button class="red" data-ok>${esc(okLabel)}</button></div></div>`;
  d.classList.add('open');
  $('[data-no]',d).onclick=()=>d.classList.remove('open');
  $('[data-ok]',d).onclick=()=>{d.classList.remove('open');onOk()};
}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
const walletOptions=(sel,none)=>(none?`<option value="">${none}</option>`:'')+S.wallets.map(w=>`<option value="${w.id}" ${w.id===sel?'selected':''}>${esc(w.icon)} ${esc(w.name)}</option>`).join('');

    <div class="flabel">اللون</div><div class="field-group" style="margin:0"><div class="swatches">${COLORS.map(c=>`<button class="sw ${c===d.color?'on':''}" data-c="${c}" style="background:${c}" aria-label="لون"></button>`).join('')}</div></div>
    ${w?`<div class="btns"><button class="btn ghost block" id="wtx">عرض معاملات المحفظة</button><button class="btn danger block" id="wdel">حذف المحفظة</button></div>`:''}`,
    onMount(ov){
      $('#wt',ov).onchange=e=>{const t=WTYPES.find(x=>x.n===e.target.value);if(t){d.icon=t.i;$$('.em',ov).forEach(b=>b.classList.toggle('on',b.dataset.i===d.icon))}};
      $$('.em',ov).forEach(b=>b.onclick=()=>{d.icon=b.dataset.i;$$('.em',ov).forEach(x=>x.classList.toggle('on',x===b))});
      $$('.sw',ov).forEach(b=>b.onclick=()=>{d.color=b.dataset.c;$$('.sw',ov).forEach(x=>x.classList.toggle('on',x===b))});
      if(w){
        $('#wtx',ov).onclick=()=>{closeSheet();Object.assign(F,{q:'',type:'all',cat:'',month:'',wallet:w.id});go('tx')};

          const removed=S.txs.filter(t=>t.walletId===w.id||t.toWalletId===w.id).map(t=>t.id);
          S.debts.forEach(db=>db.payments.forEach(p=>{if(removed.includes(p.txId))p.txId=null}));(S.reminders||[]).forEach(r=>{if(removed.includes(r.txId))r.txId=null;(r.history||[]).forEach(e=>{if(removed.includes(e.txId))e.txId=null})});
          S.txs=S.txs.filter(t=>!removed.includes(t.id));S.wallets=S.wallets.filter(x=>x.id!==w.id);

/* ----- transaction sheet ----- */
function txSheet(id,presetType){
  if(!S.wallets.length){toast('أضف محفظة أولًا');return walletSheet()}
  const t=id?S.txs.find(x=>x.id===id):null;
  const d=t?{...t}:{type:presetType||'expense',amount:'',category:presetType==='income'?'راتب':'طعام',walletId:F.wallet||S.wallets[0].id,toWalletId:(S.wallets.find(w=>w.id!==(F.wallet||S.wallets[0].id))||{}).id||'',date:today(),note:''};
  const linked=t&&t.debtId?S.debts.find(x=>x.id===t.debtId):null;
  const body=()=>`
    ${linked?'':`<div class="seg" style="margin-top:6px">${[['expense','مصروف'],['income','دخل'],['transfer','تحويل']].map(([k,l])=>`<button class="${d.type===k?'on':''}" data-type="${k}">${l}</button>`).join('')}</div>`}
    <div class="amount-in"><span>المبلغ (${curHTML()})</span><input id="ta" inputmode="decimal" placeholder="0" value="${d.amount}" style="color:${d.type==='income'?'var(--inc)':d.type==='expense'?'var(--exp)':'var(--tr)'}"></div>
    ${linked?`<div class="note">هذه المعاملة دفعة للدين «${esc(linked.name)}». تعديل المبلغ أو حذفها ينعكس على الدين.</div>`:''}
    ${d.type!=='transfer'?`<div class="flabel">التصنيف</div><div class="cats">${cats(d.type).map(c=>`<button class="cat ${c.n===d.category?'on':''}" data-cat="${esc(c.n)}"><span class="e">${c.i}</span>${esc(c.n)}</button>`).join('')}</div>`:''}
    <div class="field-group">
      <div class="field"><label for="tw">${d.type==='transfer'?'من':'المحفظة'}</label><select id="tw">${walletOptions(d.walletId)}</select></div>
      ${d.type==='transfer'?`<div class="field"><label for="tw2">إلى</label><select id="tw2">${walletOptions(d.toWalletId)}</select></div>`:''}
      <div class="field"><label for="td">التاريخ</label><input id="td" type="date" value="${d.date}"></div>
      <div class="field"><label for="tn">الوصف</label><input id="tn" value="${esc(d.note)}" placeholder="اختياري" maxlength="60"></div>
    </div>
    ${t?`<div class="btns"><button class="btn danger block" id="tdel">حذف المعاملة</button></div>`:''}`;
  const grab=()=>{d.amount=$('#ta').value;d.walletId=$('#tw').value;if($('#tw2'))d.toWalletId=$('#tw2').value;d.date=$('#td').value||today();d.note=$('#tn').value};
  const mount=ov=>{
    $$('[data-type]',ov).forEach(b=>b.onclick=()=>{grab();d.type=b.dataset.type;if(d.type!=='transfer'&&!cats(d.type).some(c=>c.n===d.category))d.category=cats(d.type)[0].n;
      if(d.type==='transfer'&&(!d.toWalletId||d.toWalletId===d.walletId))d.toWalletId=(S.wallets.find(w=>w.id!==d.walletId)||{}).id||'';
      $('.sheet-body',ov).innerHTML=body();mount(ov)});
    $$('[data-cat]',ov).forEach(b=>b.onclick=()=>{d.category=b.dataset.cat;$$('[data-cat]',ov).forEach(x=>x.classList.toggle('on',x===b))});
    if($('#tdel',ov))$('#tdel',ov).onclick=()=>confirmBox('حذف المعاملة؟',linked?'ستُحذف الدفعة المقابلة من الدين أيضًا.':'لا يمكن التراجع عن هذا الإجراء.','حذف',()=>{
      S.txs=S.txs.filter(x=>x.id!==t.id);if(linked){linked.payments=linked.payments.filter(p=>p.txId!==t.id);paymentRemoved(linked)}if(t.reminderId){const rm=(S.reminders||[]).find(r=>r.id===t.reminderId);if(rm){const e=(rm.history||[]).find(h=>h.txId===t.id);if(isRec(rm)&&e){e.txId=null;removeRemEntry(rm,e.id)}else{rm.done=false;rm.txId=null;rm.doneDate='';if(e)rm.history=rm.history.filter(h=>h!==e)}}}closeSheet();commit('حُذفت المعاملة')});
    if(!t)setTimeout(()=>$('#ta',ov)?.focus(),300);
  };
  openSheet({title:t?'تعديل المعاملة':(presetType==='transfer'?'تحويل بين المحافظ':'معاملة جديدة'),body:body(),onMount:mount,onSave(){
    grab();const amount=toNum(d.amount);
    if(!(amount>0)){toast('أدخل مبلغًا أكبر من صفر');return false}
    if(d.type==='transfer'){if(S.wallets.length<2){toast('تحتاج محفظتين على الأقل للتحويل');return false}if(d.walletId===d.toWalletId){toast('اختر محفظتين مختلفتين');return false}}
    const rec={id:t?t.id:uid(),type:d.type,amount,category:d.type==='transfer'?'':d.category,walletId:d.walletId,toWalletId:d.type==='transfer'?d.toWalletId:undefined,date:d.date,note:d.note.trim()};
    if(t?.debtId)rec.debtId=t.debtId;
    if(t){Object.keys(t).forEach(k=>delete t[k]);Object.assign(t,rec);if(linked){const p=linked.payments.find(p=>p.txId===t.id);if(p){p.amount=amount;p.date=d.date}}}
    else S.txs.push(rec);
    commit(t?'حُفظت التعديلات':'سُجّلت المعاملة');
  }});
}

    const auto=$('#dauto',ov);if(auto)auto.onchange=()=>{grab();rerender()};

    const n=processAutoPay();

function debtDetail(id){

  openSheet({title:d.name,noSave:true,body:`

}
function paymentSheet(id,presetAmount){

  const def=presetAmount>0?Math.min(presetAmount,i.remaining):(i.dueAmount>0?i.dueAmount:i.remaining);
  const defWallet=walletById(d.autoWalletId)?d.autoWalletId:S.wallets[0]?.id;
  openSheet({title:d.kind==='owe'?'تسجيل دفعة':'تسجيل تحصيل',saveLabel:'تسجيل',body:`

    ${x&&!sys?`<div class="btns"><button class="btn danger block" id="cdel">حذف التصنيف</button></div>${used?`<div class="note">مستخدم في ${fmtN(used,false)} سجل، وعند الحذف تنتقل إلى «أخرى».</div>`:''}`:''}`,
    onMount(ov){
      $$('[data-e]',ov).forEach(b=>b.onclick=()=>{d.i=b.dataset.e;$('#ci',ov).value=d.i;$$('[data-e]',ov).forEach(y=>y.classList.toggle('on',y===b))});
      $$('.sw',ov).forEach(b=>b.onclick=()=>{d.c=b.dataset.c;$$('.sw',ov).forEach(y=>y.classList.toggle('on',y===b))});
      if($('#cdel',ov))$('#cdel',ov).onclick=()=>confirmBox('حذف التصنيف؟',used?'ستنتقل سجلاته إلى تصنيف «أخرى».':'لا يمكن التراجع.','حذف',()=>{
        S.txs.forEach(t=>{if(t.category===x.n)t.category='أخرى'});(S.reminders||[]).forEach(r=>{if(r.category===x.n)r.category='أخرى'});
        S.categories[kind]=list.filter(c=>c!==x);closeSheet();commit('حُذف التصنيف');catsSheet(kind)});
    },
    onSave(){
      const n=sys?x.n:$('#cn').value.trim();const i=$('#ci').value.trim()||d.i;
      if(!n){toast('اكتب اسم التصنيف');return false}
      if(list.some(c=>c!==x&&c.n===n)){toast('يوجد تصنيف بنفس الاسم');return false}
      if(x){const old=x.n;x.n=n;x.i=i;x.c=d.c;
        if(old!==n){S.txs.forEach(t=>{if(t.category===old)t.category=n});(S.reminders||[]).forEach(r=>{if(r.category===old)r.category=n})}}
      else list.push({n,i,c:d.c});
      commit(x?'حُفظ التصنيف':'أُضيف التصنيف');setTimeout(()=>catsSheet(kind),50);
    }});
}
function layoutSheet(){
  const body=()=>{const L=homeLayout();return `
    <div class="note" style="margin:6px 4px 10px">رتّب أقسام الصفحة الرئيسية بالأسهم، وأخفِ ما لا تحتاجه.</div>
    <div class="group">${L.map((x,i)=>{const m=HOME_SECTIONS.find(h=>h[0]===x.id);return `
      <div class="lrow">
        <span style="font-size:20px">${m[2]}</span>
        <div class="grow" style="${x.on?'':'opacity:.45'}"><div class="t1">${m[1]}</div></div>
        <button class="mv" data-up="${i}" ${i===0?'disabled':''} aria-label="أعلى">↑</button>
        <button class="mv" data-down="${i}" ${i===L.length-1?'disabled':''} aria-label="أسفل">↓</button>
        <input type="checkbox" class="switch" data-vis="${i}" ${x.on?'checked':''} aria-label="إظهار">
      </div>`}).join('')}</div>
    <div class="btns"><button class="btn ghost block" id="lreset">استعادة الترتيب الافتراضي</button></div>`};
  const mount=ov=>{
    const upd=L=>{S.settings.homeOrder=L;save();renderHome();$('.sheet-body',ov).innerHTML=body();mount(ov)};
    $$('[data-up]',ov).forEach(b=>b.onclick=()=>{const L=homeLayout();const i=+b.dataset.up;[L[i-1],L[i]]=[L[i],L[i-1]];upd(L)});
    $$('[data-down]',ov).forEach(b=>b.onclick=()=>{const L=homeLayout();const i=+b.dataset.down;[L[i+1],L[i]]=[L[i],L[i+1]];upd(L)});
    $$('[data-vis]',ov).forEach(c=>c.onchange=()=>{const L=homeLayout();L[+c.dataset.vis].on=c.checked;upd(L)});
    $('#lreset',ov).onclick=()=>upd(HOME_SECTIONS.map(h=>({id:h[0],on:true})));
  };
  openSheet({title:'تخصيص الرئيسية',noSave:true,body:body(),onMount:mount});
}

/* ----- settings ----- */

function settingsSheet(){
  const st={...S.settings};
  openSheet({title:'الإعدادات',body:`
    <div class="flabel">المظهر</div>
    <div class="seg">${[['auto','تلقائي'],['light','فاتح'],['dark','داكن']].map(([k,l])=>`<button class="${st.theme===k?'on':''}" data-th="${k}">${l}</button>`).join('')}</div>
    <div class="flabel">لون التطبيق</div>
    <div class="palettes">${Object.entries(PALETTES).map(([k,P])=>`<button class="pal ${(S.settings.palette||'gold')===k?'on':''}" data-pal="${k}"><span class="sw2" style="background:${P.d.accent}"><i style="background:${P.l.hero}"></i></span>${P.n}</button>`).join('')}</div>
    <div class="flabel">الصفحة الرئيسية</div>
    <div class="btns" style="margin-top:0"><button class="btn ghost block" id="slayout">⇅ ترتيب وإظهار الأقسام</button><button class="btn ghost block" id="scats">🏷️ تعديل التصنيفات</button></div>
    <div class="field-group">
      <div class="field"><label for="sc">العملة</label><input id="sc" value="${st.currency===AED_SYM?'':esc(st.currency)}" maxlength="6" placeholder="${st.currency===AED_SYM?'رمز الدرهم':'د.إ'}"></div>
      <div class="qchips" style="padding-top:2px">${[[AED_SYM,AED_SVG],['د.إ','د.إ'],['AED','AED'],['درهم','درهم']].map(([v,l])=>`<button class="chip ${st.currency===v?'on':''}" data-cur="${esc(v)}" style="${v===AED_SYM?'font-size:17px':''}">${l}</button>`).join('')}</div>
      <div class="field"><label for="spd">يوم نزول الراتب</label><select id="spd">${Array.from({length:31},(_,i)=>i+1).map(n=>`<option value="${n}" ${payday()===n?'selected':''}>${n===1?'1 (بداية الشهر)':n}</option>`).join('')}</select></div>
      <div class="field"><label for="sb">الميزانية الشهرية</label><input id="sb" inputmode="decimal" value="${st.budget||''}" placeholder="0" style="direction:ltr;text-align:end"></div>
    </div>
    <div class="flabel">إضافة الدخل الإضافي للميزانية</div>
    <div class="seg">${[0,25,50,75,100].map(n=>`<button class="${extraPct()===n?'on':''}" data-xp="${n}">${n}%</button>`).join('')}</div>
    <div class="note">الدخل الإضافي هو أي دخل بغير تصنيف «راتب» أو «تحصيل ديون»، مثل عمل حر أو بيع أو هدية. يُضاف منه النسبة المختارة لميزانية نفس الشهر، والباقي يبقى للادخار.</div>
    <div class="note">يوم نزول الراتب يحدد بداية «الشهر» في كل الصفحات. مثلًا 24 يجعل الشهر من 24 إلى 23 من الشهر التالي.</div>
    <div class="note">تُحفظ بياناتك على هذا الجهاز وفي هذا المتصفح فقط. صدّر نسخة احتياطية بانتظام.</div>
    <div class="flabel">النسخ الاحتياطي</div>
    <div class="btns" style="margin-top:0">
      <button class="btn block" id="sexp">حفظ نسخة احتياطية في الملفات</button>
      <button class="btn ghost block" id="sfilebtn">استعادة من ملف</button>
      <input type="file" id="sfile" accept=".json,application/json" hidden>
      <div class="note" style="margin:2px 4px 0">${S.settings.lastBackup?`آخر نسخة: ${dateStr(S.settings.lastBackup)}`:'لم تُحفظ أي نسخة بعد'}</div>
      <button class="btn ghost block" id="scopy">عرض البيانات للنسخ</button>
    </div>
    <textarea class="code" id="sjson" placeholder="الصق هنا نسخة احتياطية ثم اضغط استيراد" style="margin-top:10px"></textarea>
    <div class="btns" style="margin-top:8px"><button class="btn ghost block" id="simp">استيراد البيانات الملصقة</button></div>
    <div class="flabel">إدارة البيانات</div>
    <div class="btns" style="margin-top:0">
      <button class="btn ghost block" id="sdemo">تحميل بيانات تجريبية</button>
      <button class="btn danger block" id="sclear">مسح جميع البيانات</button>
    </div>`,
    onMount(ov){
      $$('[data-th]',ov).forEach(b=>b.onclick=()=>{st.theme=b.dataset.th;S.settings.theme=st.theme;save();$$('[data-th]',ov).forEach(x=>x.classList.toggle('on',x===b));applyTheme(st.theme)});
      $$('[data-pal]',ov).forEach(b=>b.onclick=()=>{S.settings.palette=b.dataset.pal;save();applyPalette(b.dataset.pal);$$('[data-pal]',ov).forEach(x=>x.classList.toggle('on',x===b));applyTheme(S.settings.theme);render()});
      $('#slayout',ov).onclick=()=>layoutSheet();
      $('#scats',ov).onclick=()=>catsSheet('expense');
      $$('[data-xp]',ov).forEach(b=>b.onclick=()=>{st.extraPct=+b.dataset.xp;$$('[data-xp]',ov).forEach(x=>x.classList.toggle('on',x===b))});
      $$('[data-cur]',ov).forEach(b=>b.onclick=()=>{st.currency=b.dataset.cur;$('#sc',ov).value=st.currency===AED_SYM?'':st.currency;$('#sc',ov).placeholder=st.currency===AED_SYM?'رمز الدرهم':'';$$('[data-cur]',ov).forEach(x=>x.classList.toggle('on',x===b))});
      $('#sc',ov).oninput=e=>{st.currency=e.target.value.trim()||AED_SYM;$$('[data-cur]',ov).forEach(x=>x.classList.toggle('on',x.dataset.cur===st.currency))};
      const dump=()=>JSON.stringify(S,null,1);
      const markBackup=()=>{S.settings.lastBackup=today();save()};
      $('#sexp',ov).onclick=async()=>{
        const name=`prudence-backup-${today()}.json`;const data=dump();
        try{
          const file=new File([data],name,{type:'application/json'});
          if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});markBackup();closeSheet();render();toast('حُفظت النسخة الاحتياطية');return}
        }catch(e){if(e&&e.name==='AbortError')return}
        try{const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);markBackup();closeSheet();render();toast('حُفظت النسخة الاحتياطية')}
        catch(e){toast('تعذّر الحفظ، استخدم «عرض البيانات للنسخ»')}
      };
      const doImport=txt=>{let d;try{d=JSON.parse(txt)}catch(e){toast('الملف ليس نسخة احتياطية صالحة');return}
        if(!d||!Array.isArray(d.wallets)){toast('الملف ليس نسخة احتياطية صالحة');return}
        confirmBox('استعادة البيانات؟','ستُستبدل بياناتك الحالية بالكامل.','استعادة',()=>{S=normalize(d);applyPalette(S.settings.palette);applyTheme(S.settings.theme);closeSheet();commit('اكتملت الاستعادة')})};
      $('#sfilebtn',ov).onclick=()=>$('#sfile',ov).click();
      $('#sfile',ov).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(f);e.target.value=''};
      $('#scopy',ov).onclick=()=>{const ta=$('#sjson',ov);ta.value=dump();ta.focus();ta.select();try{navigator.clipboard.writeText(ta.value).then(()=>toast('نُسخت البيانات'),()=>{})}catch(e){}};
      $('#simp',ov).onclick=()=>doImport($('#sjson',ov).value);
      $('#sdemo',ov).onclick=()=>confirmBox('تحميل بيانات تجريبية؟','ستُستبدل بياناتك الحالية.','تحميل',()=>{const cur=S.settings;S=seed();S.settings.theme=cur.theme;S.settings.palette=cur.palette;S.settings.homeOrder=cur.homeOrder;closeSheet();commit('حُمّلت البيانات التجريبية')});
      $('#sclear',ov).onclick=()=>confirmBox('مسح جميع البيانات؟','ستُحذف المحافظ والمعاملات والديون نهائيًا.','مسح',()=>{const th=S.settings.theme,c=S.settings.currency;S=blank();S.settings.theme=th;S.settings.currency=c;S.settings.palette=S.settings.palette;closeSheet();commit('مُسحت البيانات')});
    },
    onSave(){
      const b=$('#sb').value.trim()?toNum($('#sb').value):0;if(isNaN(b)||b<0){toast('الميزانية غير صالحة');return false}
      const pdOld=payday();S.settings={...S.settings,currency:st.currency||AED_SYM,budget:b,payday:parseInt($('#spd').value)||1,extraPct:st.extraPct==null?extraPct():st.extraPct};
      if(payday()!==pdOld){homeMonth=null;F.month=''}
      commit('حُفظت الإعدادات');
    }});
}

/* ============ theme ============ */
function applyTheme(t){
  const r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');
  setTimeout(()=>{const m=document.getElementById('themeColor');if(m)m.setAttribute('content',cssv('--bg')||'#F2F2F7')},0);
  if(tab==='reports')setTimeout(renderReports,30);
}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme(S.settings.theme)})}catch(e){}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tab');if(tb){go(tb.dataset.tab);return}
  const el=e.target.closest('[data-act]');if(!el||el.closest('#sheet'))return;
  const a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'new-tx':txSheet();break;
    case 'new-transfer':txSheet(null,'transfer');break;
    case 'tx':txSheet(id);break;
    case 'new-wallet':walletSheet();break;
    case 'wallet':walletSheet(id);break;
    case 'settings':settingsSheet();break;
    case 'goto-tx':Object.assign(F,{q:'',type:'all',cat:'',wallet:'',month:''});go('tx');break;
    case 'month':{const n=shiftMonth(homeMonth,+el.dataset.d);if(n<=curPeriod()){homeMonth=n;renderHome()}break}
    case 'ftype':F.type=el.dataset.k;renderTxResults();break;
    case 'clear-filters':Object.assign(F,{q:'',type:'all',cat:'',wallet:'',month:''});renderTx();break;
    case 'new-debt':debtForm();break;
    case 'debt':debtDetail(id);break;
    case 'dfilter':debtFilter=el.dataset.k;renderDebts();break;
    case 'due-view':dueView=el.dataset.k;renderHome();break;
    case 'fc-view':forecastView=el.dataset.k;renderHome();break;
    case 'fc-pri':S.settings.forecastPri=+el.dataset.k;save();renderHome();break;
    case 'quickpay':paymentSheet(id,+el.dataset.amt);break;
    case 'goto-debts':debtsTab='debts';go('debts');break;
    case 'goto-rem':debtsTab='rem';remFilter='open';go('debts');break;
    case 'dtab':debtsTab=el.dataset.k;renderDebts();break;
    case 'remfilter':remFilter=el.dataset.k;renderReminders();break;
    case 'new-rem':reminderForm();break;
    case 'new-income':reminderForm(null,'income');break;
    case 'rem':reminderForm(id);break;
    case 'rem-pay':remPaySheet(id);break;
    case 'layout':layoutSheet();break;
    case 'range':reportRange=+el.dataset.k;renderReports();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#dialog').classList.contains('open'))$('#dialog').classList.remove('open');else if($('#sheet').classList.contains('open'))closeSheet()}});

/* ============ boot ============ */
S=load();if(!S.settings.firstUse)S.settings.firstUse=today();
{const n=processAutoPay()+processAutoRem();save();applyPalette(S.settings.palette);applyTheme(S.settings.theme);render();if(n)setTimeout(()=>toast(`سُجّل ${fmtN(n,false)} مبلغ تلقائيًا`),600)}
let lastDay=today();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;
  const n=processAutoPay()+processAutoRem();if(n||lastDay!==today()){lastDay=today();save();render();if(n)toast(`سُجّل ${fmtN(n,false)} مبلغ تلقائيًا`)}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
