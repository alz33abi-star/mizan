<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ميزان">
<meta name="application-name" content="ميزان">
<meta name="format-detection" content="telephone=no">
<meta id="themeColor" name="theme-color" content="#F2F2F7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>ميزان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F7F7FA;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.2);
  --text:#101418;--text2:#6B7280;--text3:#9CA3AF;--sep:rgba(60,60,67,.18);
  --accent:#0B6E63;--accentSoft:rgba(11,110,99,.12);--onAccent:#FFFFFF;
  --hero:#0B3D3A;--heroText:#EAF6F3;--heroSub:rgba(234,246,243,.68);--gold:#E3B34C;
  --inc:#15935A;--incSoft:rgba(21,147,90,.12);--exp:#D9434B;--expSoft:rgba(217,67,75,.11);
  --tr:#2F6FDB;--trSoft:rgba(47,111,219,.12);--warn:#C98309;--warnSoft:rgba(201,131,9,.14);
  --tabbar:rgba(249,249,251,.86);--shadow:0 1px 2px rgba(16,20,24,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--card:#1C1C1E;--card2:#232326;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.34);
    --text:#F4F5F7;--text2:#A1A1AA;--text3:#71717A;--sep:rgba(84,84,88,.6);
    --accent:#3CC4B2;--accentSoft:rgba(60,196,178,.16);--onAccent:#04201D;
    --hero:#0E2F2C;--heroText:#E8F7F4;--heroSub:rgba(232,247,244,.62);--gold:#F0C765;
    --inc:#34C77B;--incSoft:rgba(52,199,123,.15);--exp:#FF6B70;--expSoft:rgba(255,107,112,.14);
    --tr:#5B93F5;--trSoft:rgba(91,147,245,.16);--warn:#F2A93B;--warnSoft:rgba(242,169,59,.16);
    --tabbar:rgba(22,22,24,.86);--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1C1C1E;--card2:#232326;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.34);
  --text:#F4F5F7;--text2:#A1A1AA;--text3:#71717A;--sep:rgba(84,84,88,.6);
  --accent:#3CC4B2;--accentSoft:rgba(60,196,178,.16);--onAccent:#04201D;
  --hero:#0E2F2C;--heroText:#E8F7F4;--heroSub:rgba(232,247,244,.62);--gold:#F0C765;
  --inc:#34C77B;--incSoft:rgba(52,199,123,.15);--exp:#FF6B70;--expSoft:rgba(255,107,112,.14);
  --tr:#5B93F5;--trSoft:rgba(91,147,245,.16);--warn:#F2A93B;--warnSoft:rgba(242,169,59,.16);
  --tabbar:rgba(22,22,24,.86);--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);overscroll-behavior-y:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
.remind{display:flex;align-items:center;gap:12px;background:var(--warnSoft);border-radius:14px;padding:12px 14px;margin-top:12px}
.remind .grow{font-size:14px}
.remind b{display:block;font-size:15px}
body{font-family:"IBM Plex Sans Arabic",-apple-system,"SF Arabic","Geeza Pro",Tahoma,sans-serif;font-size:16px;line-height:1.45;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:bidi-override;display:inline-block}
.page{max-width:680px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 24px;display:none}
.page.active{display:block}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 2px 12px}
.top h1{font-size:32px;line-height:1.15;font-weight:700;margin:0}
.top .sub{color:var(--text2);font-size:14px;margin-top:2px}
.actions{display:flex;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--fill);border:0;color:var(--accent);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.solid{background:var(--accent);color:var(--onAccent)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:24px 4px 8px}
.section-h h2{font-size:20px;margin:0;font-weight:700}
.link{background:none;border:0;color:var(--accent);font-size:15px;padding:4px 0}
.group{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;position:relative;width:100%;background:none;border:0;text-align:start}
button.row:active{background:var(--fill)}
.row+.row::before{content:"";position:absolute;top:0;right:66px;left:0;height:1px;transform:scaleY(.5);background:var(--sep)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.grow{flex:1;min-width:0}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{color:var(--text2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;white-space:nowrap}
.pos{color:var(--inc)}.neg{color:var(--exp)}.trc{color:var(--tr)}
.chev{color:var(--text3);width:16px;height:16px;flex:none}
.empty{padding:28px 18px;text-align:center;color:var(--text2)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--accent);color:var(--onAccent)}
.btn.ghost{background:var(--accentSoft);color:var(--accent)}
.btn.danger{background:var(--expSoft);color:var(--exp)}
.btn.block{width:100%}

/* hero */
.hero{background:var(--hero);color:var(--heroText);border-radius:22px;padding:20px 20px 18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -70px auto;width:210px;height:210px;border-radius:50%;
  border:28px solid rgba(255,255,255,.05)}
.hero .lbl{color:var(--heroSub);font-size:14px}
.hero .big{font-size:40px;font-weight:700;line-height:1.1;margin:6px 0 2px;letter-spacing:-.5px}
.hero .big small{font-size:18px;font-weight:500;color:var(--heroSub);margin-inline-start:6px}
.hero .meta{display:flex;gap:16px;margin-top:14px;font-size:13px;color:var(--heroSub);position:relative;z-index:1}
.hero .meta b{color:var(--heroText);font-weight:600}
.scale{margin-top:16px;position:relative;z-index:1}
.scale .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;overflow:hidden;gap:3px}
.scale .bar i{display:block;height:100%}
.scale .legend{display:flex;justify-content:space-between;font-size:12px;color:var(--heroSub);margin-top:6px}

.monthnav{display:flex;align-items:center;gap:6px}
.monthnav button{width:30px;height:30px;border-radius:50%;border:0;background:var(--fill);color:var(--text)}
.monthnav span{font-weight:600;min-width:112px;text-align:center;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);min-width:0}
.tile .k{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px}
.tile .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tile .v{font-size:17px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.budget{background:var(--card);border-radius:14px;padding:14px;margin-top:8px;box-shadow:var(--shadow)}
.budget .head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.progress{height:8px;border-radius:8px;background:var(--fill);overflow:hidden}
.progress i{display:block;height:100%;border-radius:8px;background:var(--accent);transition:width .4s}

/* search & filters */
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 10px;height:40px}
.search svg{width:18px;height:18px;color:var(--text2);flex:none}
.search input{border:0;background:none;outline:none;flex:1;height:100%;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--card);color:var(--text);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;box-shadow:var(--shadow)}
.chip.on{background:var(--text);color:var(--bg)}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.selwrap{position:relative}
.selwrap select,.selwrap input{width:100%;appearance:none;-webkit-appearance:none;border:0;background:var(--card);border-radius:10px;padding:8px 10px;font-size:14px;height:38px;box-shadow:var(--shadow)}
.day-h{display:flex;justify-content:space-between;color:var(--text2);font-size:13px;margin:18px 6px 6px}
.stat-line{display:flex;gap:8px;margin-top:10px}
.stat-line div{flex:1;background:var(--card);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--text2);box-shadow:var(--shadow)}
.stat-line b{display:block;font-size:16px;color:var(--text)}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 6px;font-size:14px;font-weight:500;color:var(--text)}
.seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12);font-weight:600}

/* debts */
.debt{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);width:100%;border:0;text-align:start;display:block;margin-bottom:10px}
.debt:active{opacity:.85}
.debt .hd{display:flex;align-items:center;gap:12px}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.b-late{background:var(--expSoft);color:var(--exp)}
.b-soon{background:var(--warnSoft);color:var(--warn)}
.b-ok{background:var(--fill);color:var(--text2)}
.b-done{background:var(--incSoft);color:var(--inc)}
.debt .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;font-size:12px;color:var(--text2)}
.debt .nums b{display:block;font-size:15px;color:var(--text);font-weight:600}
.debt .progress{margin-top:12px}
.dsum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dsum .tile .v{font-size:20px}

/* reports */
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-top:12px}
.card h3{margin:0 0 2px;font-size:17px}
.card .hint{color:var(--text2);font-size:13px;margin-bottom:12px}
.chartbox{position:relative;height:230px}
.chartbox.sq{height:220px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.leg{margin-top:12px}
.leg .li{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.leg .li+.li{border-top:1px solid var(--sep)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}

/* tab bar */
.tabbar{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--tabbar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--sep);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--text3);font-size:11px;font-weight:500}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}

/* sheet */
.overlay{position:fixed;inset:0;z-index:50;display:none}
.overlay.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:fade .2s ease}
.sheet-panel{position:absolute;inset:auto 0 0 0;max-width:680px;margin:0 auto;background:var(--bg);border-radius:14px 14px 0 0;
  max-height:94vh;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:7px auto 0}
.sheet-head{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;padding:6px 12px 8px}
.sheet-head h3{margin:0;text-align:center;font-size:17px;font-weight:600}
.txtbtn{border:0;background:none;color:var(--accent);font-size:16px;padding:6px 4px;text-align:start}
.txtbtn.strong{font-weight:700;text-align:end}
.sheet-body{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.field-group{background:var(--card);border-radius:12px;overflow:hidden;margin-top:14px}
.field{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:48px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;right:14px;left:0;height:1px;transform:scaleY(.5);background:var(--sep)}
.field label{width:98px;flex:none;color:var(--text);font-size:15px}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;padding:12px 0;text-align:start}
.field select{appearance:none;-webkit-appearance:none}
.field textarea{resize:none;min-height:70px}
.flabel{color:var(--text2);font-size:13px;margin:16px 14px 6px}
.amount-in{background:var(--card);border-radius:14px;margin-top:14px;padding:14px;text-align:center}
.amount-in input{border:0;background:none;outline:none;text-align:center;font-size:40px;font-weight:700;width:100%;direction:ltr}
.amount-in>span{color:var(--text2);font-size:14px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.cat{border:0;background:var(--card);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.cat .e{font-size:22px}
.cat.on{outline:2px solid var(--accent);background:var(--accentSoft)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px}
.sw{width:32px;height:32px;border-radius:50%;border:0}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--text)}
.emojis{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}
.em{width:44px;height:44px;border-radius:12px;border:0;background:var(--fill);font-size:22px}
.em.on{outline:2px solid var(--accent)}
.note{font-size:13px;color:var(--text2);margin:8px 14px 0}
.btns{display:grid;gap:8px;margin-top:20px}
.dstats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
textarea.code{width:100%;min-height:120px;border:0;border-radius:12px;background:var(--card);padding:12px;font-size:12px;direction:ltr;font-family:ui-monospace,Menlo,monospace}

/* dialog + toast */
.dialog{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);padding:24px}
.dialog.open{display:flex}
.dialog .box{background:var(--card2);border-radius:14px;width:100%;max-width:290px;text-align:center;overflow:hidden;animation:fade .15s}
.dialog .box p{margin:0;padding:18px 16px 16px;font-size:15px}
.dialog .box p b{display:block;font-size:17px;margin-bottom:4px}
.dialog .dbtns{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--sep)}
.dialog .dbtns button{border:0;background:none;padding:12px;font-size:16px;color:var(--accent)}
.dialog .dbtns button+button{border-inline-start:1px solid var(--sep)}
.dialog .dbtns .red{color:var(--exp);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:90;
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.hero .big{font-size:34px}.tile .v{font-size:15px}.filters{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<main id="p-home" class="page active"></main>
<main id="p-tx" class="page"></main>
<main id="p-debts" class="page"></main>
<main id="p-reports" class="page"></main>

<nav class="tabbar" aria-label="التنقل">
  <div class="in">
    <button class="tab on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7V5.5A1.5 1.5 0 0 0 15.5 4H5a2 2 0 0 0-2 2v1"/><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M21 11h-4a2 2 0 0 0 0 4h4"/></svg>المحافظ</button>
    <button class="tab" data-tab="tx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m16 3 4 4-4 4"/><path d="M20 7H8"/><path d="m8 21-4-4 4-4"/><path d="M4 17h12"/></svg>المعاملات</button>
    <button class="tab" data-tab="debts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>الديون</button>
    <button class="tab" data-tab="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><rect x="5" y="11" width="3" height="6" rx="1"/><rect x="10.5" y="5" width="3" height="12" rx="1"/><rect x="16" y="8" width="3" height="9" rx="1"/></svg>التقارير</button>
  </div>
</nav>

<div id="sheet" class="overlay"></div>
<div id="dialog" class="dialog"></div>
<div id="toast" class="toast" role="status"></div>

<script>
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const curMonth=()=>today().slice(0,7);
const shiftMonth=(key,n)=>{const [y,m]=key.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const monthEnd=key=>{const [y,m]=key.split('-').map(Number);return ymd(new Date(y,m,0))};
const addMonths=(s,n)=>{const d=parseD(s);const day=d.getDate();const t=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return ymd(t)};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toNum=v=>{const s=String(v??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g,'.').replace(/[^\d.\-]/g,'');const n=parseFloat(s);return isFinite(n)?n:NaN};
const NF=new Intl.NumberFormat('ar-u-nu-latn',{maximumFractionDigits:2});
const NF0=new Intl.NumberFormat('ar-u-nu-latn',{maximumFractionDigits:0});
const fmtN=(n,dec=true)=>(dec?NF:NF0).format(Math.round(n*100)/100);
const cur=()=>S.settings.currency||'';

function seed(){
  const d=blank();
  let sd=11;const rnd=()=>(sd=(sd*9301+49297)%233280)/233280;
  const W=(name,type,icon,color,initial)=>{const w={id:uid(),name,type,icon,color,initial};d.wallets.push(w);return w};
  const bank=W('الحساب الجاري','حساب بنكي','🏦','#0B6E63',4200);
  const cash=W('النقد','نقدي','💵','#C9A227',600);
  const saving=W('حساب الادخار','ادخار','🐷','#7A5AF8',8000);
  const card=W('بطاقة الائتمان','بطاقة ائتمان','💳','#DB2777',0);
  d.settings.budget=7500;
  const t0=today();
  const tx=(type,amount,category,walletId,date,note,extra={})=>{if(date>t0)return null;const t={id:uid(),type,amount:Math.round(amount),category,walletId,date,note,...extra};d.txs.push(t);return t};
  for(let m=-5;m<=0;m++){
    const mk=shiftMonth(curMonth(),m);const day=n=>`${mk}-${pad(n)}`;
    tx('income',9500,'راتب',bank.id,day(1),'راتب الشهر');
    tx('expense',2500,'سكن',bank.id,day(2),'إيجار الشقة');
    tx('expense',380+rnd()*120,'فواتير',bank.id,day(5),'كهرباء وإنترنت');
    tx('transfer',1000,'',bank.id,day(3),'ادخار شهري',{toWalletId:saving.id});
    tx('transfer',500,'',bank.id,day(4),'سحب نقدي',{toWalletId:cash.id});
    for(let k=0;k<4;k++)tx('expense',220+rnd()*260,'بقالة',bank.id,day(6+k*6),'مشتريات المنزل');
    for(let k=0;k<3;k++)tx('expense',45+rnd()*120,'طعام',cash.id,day(8+k*7),['قهوة وفطور','مطعم','عشاء مع الأصدقاء'][k]);
    tx('expense',180+rnd()*140,'مواصلات',bank.id,day(10),'وقود');
    tx('expense',120+rnd()*110,'مواصلات',card.id,day(19),'صيانة وغسيل');
    tx('expense',200+rnd()*500,'تسوق',card.id,day(15),'ملابس');
    tx('expense',90+rnd()*200,'ترفيه',card.id,day(21),'اشتراكات وسينما');
    if(rnd()>.5)tx('expense',150+rnd()*200,'صحة',bank.id,day(17),'صيدلية');
    tx('transfer',600+rnd()*300,'',bank.id,day(25),'سداد البطاقة',{toWalletId:card.id});
    if(m%2===0)tx('income',1200+rnd()*900,'عمل حر',bank.id,day(22),'مشروع تصميم');
  }
  const addDebt=(o,payCount,walletId)=>{
    const debt={id:uid(),payments:[],note:'',...o};d.debts.push(debt);
    const inst=debt.installments?debt.total/debt.installments:0;
    for(let i=0;i<payCount;i++){
      const date=addMonths(debt.startDate,i);if(date>t0)break;
      const amount=inst||o._pay;
      const t=tx(debt.kind==='owe'?'expense':'income',amount,debt.kind==='owe'?'سداد ديون':'تحصيل ديون',walletId,date,'دفعة: '+debt.name,{debtId:debt.id});
      debt.payments.push({id:uid(),amount:Math.round(amount),date,txId:t?t.id:null});
    }
    delete debt._pay;
  };
  addDebt({name:'تمويل السيارة',party:'البنك',kind:'owe',total:48000,installments:40,startDate:addMonths(shiftMonth(curMonth(),-5)+'-12',0)},6,bank.id);
  addDebt({name:'جوال بالتقسيط',party:'متجر الإلكترونيات',kind:'owe',total:4200,installments:12,startDate:shiftMonth(curMonth(),-4)+'-08'},4,card.id);
  addDebt({name:'سلفة لخالد',party:'خالد',kind:'lend',total:3000,installments:0,startDate:shiftMonth(curMonth(),-2)+'-14',dueDate:addMonths(today(),1),_pay:1000},1,bank.id);
  return d;
}

/* ============ calculations ============ */
function balances(upTo){
  const b={};S.wallets.forEach(w=>b[w.id]=+w.initial||0);
  for(const t of S.txs){
    if(upTo&&t.date>upTo)continue;const a=+t.amount||0;
    if(t.type==='income'){if(t.walletId in b)b[t.walletId]+=a}
    else if(t.type==='expense'){if(t.walletId in b)b[t.walletId]-=a}
    else{if(t.walletId in b)b[t.walletId]-=a;if(t.toWalletId in b)b[t.toWalletId]+=a}
  }
  return b;
}
const totalBalance=upTo=>Object.values(balances(upTo)).reduce((a,x)=>a+x,0);
function monthTotals(mk){
  let inc=0,exp=0;const cats={};
  for(const t of S.txs){if(!t.date.startsWith(mk))continue;
    if(t.type==='income')inc+=+t.amount;
    else if(t.type==='expense'){exp+=+t.amount;cats[t.category]=(cats[t.category]||0)+ +t.amount}}
  return {inc,exp,cats};
}
function debtInfo(d){
  const total=+d.total||0;const paid=d.payments.reduce((a,p)=>a+(+p.amount||0),0);
  const remaining=Math.max(0,total-paid);const n=+d.installments||0;const inst=n?total/n:0;
  const done=remaining<=0.009;let next=null;let paidCount=0;
  if(n){paidCount=Math.min(n,Math.floor((paid+0.01)/inst));if(!done)next=addMonths(d.startDate,Math.min(n-1,paidCount))}
  else if(!done)next=d.dueDate||null;
  const days=next?daysBetween(today(),next):null;
  return {total,paid,remaining,inst,n,paidCount,next,days,done,pct:total?Math.min(100,paid/total*100):0};
}
function debtBadge(i){
  if(i.done)return '<span class="badge b-done">مسدَّد</span>';
  if(i.days==null)return '<span class="badge b-ok">بلا موعد</span>';
  if(i.days<0)return `<span class="badge b-late">متأخر ${fmtN(-i.days,false)} يوم</span>`;
  if(i.days===0)return '<span class="badge b-soon">يستحق اليوم</span>';
  if(i.days<=7)return `<span class="badge b-soon">بعد ${fmtN(i.days,false)} أيام</span>`;
  return `<span class="badge b-ok">${dateStr(i.next)}</span>`;
}

function filteredTx(){
  const q=F.q.trim().toLowerCase();
  return S.txs.filter(t=>{
    if(F.type!=='all'&&t.type!==F.type)return false;
    if(F.cat&&t.category!==F.cat)return false;
    if(F.wallet&&t.walletId!==F.wallet&&t.toWalletId!==F.wallet)return false;
    if(F.month&&!t.date.startsWith(F.month))return false;
    if(q){const w=walletById(t.walletId)?.name||'';const w2=walletById(t.toWalletId)?.name||'';
      const hay=`${t.note||''} ${t.category||''} ${w} ${w2} ${t.amount}`.toLowerCase();if(!hay.includes(q))return false}
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date));
}

  let inc=0,exp=0;list.forEach(t=>{if(t.type==='income')inc+=+t.amount;else if(t.type==='expense')exp+=+t.amount});
  const groups={};list.forEach(t=>(groups[t.date]=groups[t.date]||[]).push(t));
  $$('#p-tx .chip').forEach(c=>c.classList.toggle('on',c.dataset.k===F.type));
  const cnt=$('#txcount');if(cnt)cnt.textContent=`${fmtN(list.length,false)} معاملة`;
  const box=$('#txres');if(!box)return;
  box.innerHTML=`
  <div class="stat-line">
    <div>الدخل<b class="pos">${money(inc,{dec:false})}</b></div>
    <div>المصروفات<b class="neg">${money(exp,{dec:false})}</b></div>
    <div>الصافي<b>${money(inc-exp,{dec:false})}</b></div>
  </div>
  ${list.length?Object.keys(groups).map(d=>{
    const net=groups[d].reduce((a,t)=>a+(t.type==='income'?+t.amount:t.type==='expense'?-t.amount:0),0);
    return `<div class="day-h"><span>${dayName(d)}</span><span>${net?money(net,{sign:true,dec:false}):''}</span></div><div class="group">${groups[d].map(txRow).join('')}</div>`}).join('')
  :`<div class="group" style="margin-top:16px"><div class="empty"><b>لا توجد نتائج</b>${S.txs.length?'جرّب تغيير البحث أو الفلاتر.':'ابدأ بتسجيل أول معاملة.'}${(F.q||F.cat||F.wallet||F.month||F.type!=='all')?'<br><button class="btn ghost" data-act="clear-filters">مسح الفلاتر</button>':''}</div></div>`}`;
}

/* ============ DEBTS ============ */
function renderDebts(){
  const infos=S.debts.map(d=>({d,i:debtInfo(d)}));
  const oweRem=infos.filter(x=>x.d.kind==='owe').reduce((a,x)=>a+x.i.remaining,0);
  const lendRem=infos.filter(x=>x.d.kind==='lend').reduce((a,x)=>a+x.i.remaining,0);
  const monthDue=infos.filter(x=>!x.i.done&&x.d.kind==='owe'&&x.i.next&&x.i.next.slice(0,7)<=curMonth())
    .reduce((a,x)=>a+(x.i.n?Math.min(x.i.inst,x.i.remaining):x.i.remaining),0);
  const late=infos.filter(x=>!x.i.done&&x.i.days!=null&&x.i.days<0).length;
  let list=infos;
  if(debtFilter==='active')list=infos.filter(x=>!x.i.done);
  else if(debtFilter==='owe')list=infos.filter(x=>x.d.kind==='owe'&&!x.i.done);
  else if(debtFilter==='lend')list=infos.filter(x=>x.d.kind==='lend'&&!x.i.done);
  else if(debtFilter==='done')list=infos.filter(x=>x.i.done);
  list.sort((a,b)=>(a.i.next||'9999').localeCompare(b.i.next||'9999'));
  const fl=[['active','النشطة'],['owe','عليّ'],['lend','لي'],['done','المسدّدة']];
  $('#p-debts').innerHTML=`
  <div class="top">
    <div><h1>الديون</h1><div class="sub">${late?`<span class="neg">${fmtN(late,false)} متأخر السداد</span>`:'الالتزامات والأقساط'}</div></div>
    <div class="actions"><button class="iconbtn solid" data-act="new-debt" aria-label="دين جديد">${ICON.plus}</button></div>
  </div>
  <div class="dsum">
    <div class="tile"><div class="k"><i style="background:var(--exp)"></i>المتبقي عليّ</div><div class="v">${money(oweRem,{dec:false})}</div></div>
    <div class="tile"><div class="k"><i style="background:var(--inc)"></i>المتبقي لي</div><div class="v">${money(lendRem,{dec:false})}</div></div>
  </div>
  <div class="budget"><div class="head" style="margin:0"><span>مستحق هذا الشهر (عليّ)</span><b>${money(monthDue,{dec:false})}</b></div></div>
  <div class="chips">${fl.map(([k,l])=>`<button class="chip ${debtFilter===k?'on':''}" data-act="dfilter" data-k="${k}">${l}</button>`).join('')}</div>
  <div style="margin-top:6px">
  ${list.length?list.map(({d,i})=>`
    <button class="debt" data-act="debt" data-id="${d.id}">
      <div class="hd">
        <div class="ic" style="background:${d.kind==='owe'?'var(--expSoft)':'var(--incSoft)'};font-size:18px">${d.kind==='owe'?'📤':'📥'}</div>
        <div class="grow"><div class="t1">${esc(d.name)}</div><div class="t2">${d.kind==='owe'?'عليّ لـ':'لي عند'} ${esc(d.party||'—')}</div></div>
        ${debtBadge(i)}
      </div>
      <div class="progress"><i style="width:${i.pct}%;background:${i.done?'var(--inc)':d.kind==='owe'?'var(--accent)':'var(--inc)'}"></i></div>
      <div class="nums">
        <div>القيمة<b>${money(i.total,{dec:false})}</b></div>
        <div>المدفوع<b>${money(i.paid,{dec:false})}</b></div>
        <div>المتبقي<b>${money(i.remaining,{dec:false})}</b></div>
      </div>
      ${i.n?`<div class="t2" style="margin-top:8px">القسط ${money(i.inst)} · ${fmtN(i.paidCount,false)} من ${fmtN(i.n,false)} قسط</div>`:''}
    </button>`).join('')
  :`<div class="group"><div class="empty"><b>${S.debts.length?'لا ديون في هذا القسم':'لا توجد ديون مسجلة'}</b>${S.debts.length?'':'سجّل قرضًا أو تقسيطًا أو مبلغًا أقرضته لتتابع سداده.'}<br><button class="btn" data-act="new-debt">إضافة دين</button></div></div>`}
  </div>`;
}

/* ============ REPORTS ============ */
let charts=[];
function killCharts(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[]}
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function renderReports(){
  killCharts();
  const months=[];for(let i=reportRange-1;i>=0;i--)months.push(shiftMonth(curMonth(),-i));
  const per=months.map(monthTotals);
  const tInc=per.reduce((a,x)=>a+x.inc,0),tExp=per.reduce((a,x)=>a+x.exp,0);
  const saveRate=tInc?(tInc-tExp)/tInc*100:0;
  const cats={};per.forEach(p=>Object.entries(p.cats).forEach(([k,v])=>cats[k]=(cats[k]||0)+v));
  const catList=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const cm=monthTotals(curMonth());const budget=+S.settings.budget||0;
  const base=budget||cm.inc;
  const balSeries=months.map(m=>totalBalance(m===curMonth()?today():monthEnd(m)));
  const debtSeries=kind=>months.map(m=>{const e=m===curMonth()?today():monthEnd(m);
    return S.debts.filter(d=>d.kind===kind&&d.startDate<=e).reduce((a,d)=>a+Math.max(0,d.total-d.payments.filter(p=>p.date<=e).reduce((s,p)=>s+ +p.amount,0)),0)});
  const ranges=[[3,'3 أشهر'],[6,'6 أشهر'],[12,'سنة']];
  $('#p-reports').innerHTML=`
  <div class="top"><div><h1>التقارير</h1><div class="sub">${monthName(months[0])} – ${monthName(months[months.length-1])}</div></div></div>
  <div class="seg" role="tablist">${ranges.map(([k,l])=>`<button class="${reportRange===k?'on':''}" data-act="range" data-k="${k}">${l}</button>`).join('')}</div>
  <div class="kpis">
    <div class="tile"><div class="k">إجمالي الدخل</div><div class="v pos">${money(tInc,{dec:false})}</div></div>
    <div class="tile"><div class="k">إجمالي المصروفات</div><div class="v neg">${money(tExp,{dec:false})}</div></div>
    <div class="tile"><div class="k">متوسط الصرف الشهري</div><div class="v">${money(tExp/months.length,{dec:false})}</div></div>
    <div class="tile"><div class="k">نسبة الادخار</div><div class="v ${saveRate<0?'neg':''}"><span class="num">${fmtN(saveRate,false)}%</span></div></div>
  </div>
  ${typeof Chart==='undefined'?`<div class="card"><div class="empty"><b>تعذّر تحميل الرسوم البيانية</b>تحقق من اتصال الإنترنت ثم أعد فتح الصفحة.</div></div>`:`
  <div class="card"><h3>الدخل مقابل المصروفات</h3><div class="hint">مقارنة شهرية دون التحويلات</div><div class="chartbox"><canvas id="c1"></canvas></div></div>
  <div class="card"><h3>المصروفات حسب التصنيف</h3><div class="hint">خلال الفترة المحددة</div>
    ${catList.length?`<div class="chartbox sq"><canvas id="c2"></canvas></div><div class="leg">${catList.map(([k,v])=>{const m=catMeta('expense',k);return `<div class="li"><span class="dot" style="background:${m.c}"></span><span class="grow">${m.i} ${esc(k)}</span><span class="t2 num">${fmtN(v/tExp*100,false)}%</span><b style="min-width:92px;text-align:end">${money(v,{dec:false})}</b></div>`}).join('')}</div>`:'<div class="empty">لا مصروفات في هذه الفترة</div>'}
  </div>
  <div class="card"><h3>توزيع ميزانية ${monthName(curMonth())}</h3><div class="hint">${budget?`من الميزانية الشهرية ${money(budget,{dec:false})}`:(cm.inc?'من دخل الشهر (لم تُحدَّد ميزانية)':'حدد ميزانية شهرية من الإعدادات')}</div>
    ${base?`<div class="chartbox sq"><canvas id="c3"></canvas></div>`:''}
  </div>
  <div class="card"><h3>تطور إجمالي الرصيد</h3><div class="hint">الرصيد في نهاية كل شهر</div><div class="chartbox"><canvas id="c4"></canvas></div></div>
  <div class="card"><h3>الديون عبر الزمن</h3><div class="hint">المبالغ المتبقية في نهاية كل شهر</div><div class="chartbox"><canvas id="c5"></canvas></div></div>`}`;
  if(typeof Chart==='undefined')return;
  const text2=cssv('--text2'),sep=cssv('--sep'),inc=cssv('--inc'),exp=cssv('--exp'),acc=cssv('--accent'),card=cssv('--card'),fill=cssv('--fill2');
  Chart.defaults.font.family='"IBM Plex Sans Arabic",-apple-system,Tahoma,sans-serif';
  Chart.defaults.color=text2;Chart.defaults.borderColor=sep;
  const labels=months.map(monthShort);
  const tip={rtl:true,textDirection:'rtl',callbacks:{label:c=>` ${c.dataset.label||c.label}: ${fmtN(c.parsed.y??c.parsed)} ${cur()}`}};
  const scales={x:{grid:{display:false},reverse:true},y:{position:'right',grid:{color:sep},border:{display:false},ticks:{callback:v=>NF0.format(v)}}};
  const legend={position:'bottom',rtl:true,labels:{usePointStyle:true,boxWidth:8,padding:14}};
  charts.push(new Chart($('#c1'),{type:'bar',data:{labels,datasets:[
    {label:'الدخل',data:per.map(p=>p.inc),backgroundColor:inc,borderRadius:6,maxBarThickness:22},
    {label:'المصروفات',data:per.map(p=>p.exp),backgroundColor:exp,borderRadius:6,maxBarThickness:22}]},
    options:{maintainAspectRatio:false,plugins:{legend,tooltip:tip},scales}}));
  if(catList.length)charts.push(new Chart($('#c2'),{type:'doughnut',data:{labels:catList.map(c=>c[0]),datasets:[{data:catList.map(c=>c[1]),backgroundColor:catList.map(c=>catMeta('expense',c[0]).c),borderColor:card,borderWidth:3}]},
    options:{maintainAspectRatio:false,cutout:'66%',plugins:{legend:{display:false},tooltip:{rtl:true,callbacks:{label:c=>` ${c.label}: ${fmtN(c.parsed)} ${cur()}`}}}}}));
  if(base&&$('#c3')){
    const entries=Object.entries(cm.cats).sort((a,b)=>b[1]-a[1]);const left=Math.max(0,base-cm.exp);
    charts.push(new Chart($('#c3'),{type:'doughnut',data:{labels:[...entries.map(e=>e[0]),left?'متبقٍ':'—'],datasets:[{data:[...entries.map(e=>e[1]),left],backgroundColor:[...entries.map(e=>catMeta('expense',e[0]).c),fill],borderColor:card,borderWidth:3}]},
      options:{maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'right',rtl:true,labels:{usePointStyle:true,boxWidth:8,padding:10}},tooltip:{rtl:true,callbacks:{label:c=>` ${c.label}: ${fmtN(c.parsed)} ${cur()} (${fmtN(c.parsed/base*100,false)}%)`}}}}}));
  }
  charts.push(new Chart($('#c4'),{type:'line',data:{labels,datasets:[{label:'الرصيد',data:balSeries,borderColor:acc,backgroundColor:acc+'22',fill:true,tension:.35,pointRadius:3,pointBackgroundColor:acc}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tip},scales}}));
  charts.push(new Chart($('#c5'),{type:'line',data:{labels,datasets:[
    {label:'عليّ',data:debtSeries('owe'),borderColor:exp,backgroundColor:exp,tension:.3,pointRadius:3},
    {label:'لي',data:debtSeries('lend'),borderColor:inc,backgroundColor:inc,tension:.3,pointRadius:3,borderDash:[5,4]}]},
    options:{maintainAspectRatio:false,plugins:{legend,tooltip:tip},scales}}));
}

/* ============ sheets / dialogs ============ */
function openSheet({title,body,saveLabel='حفظ',onSave,onMount,noSave}){
  const ov=$('#sheet');
  ov.innerHTML=`<div class="sheet-bg" data-close></div><div class="sheet-panel" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="grab"></div>
    <div class="sheet-head"><button class="txtbtn" data-close>${noSave?'إغلاق':'إلغاء'}</button><h3>${esc(title)}</h3>${noSave?'<span></span>':`<button class="txtbtn strong" id="sheetSave">${saveLabel}</button>`}</div>
    <div class="sheet-body">${body}</div></div>`;
  ov.classList.add('open');document.body.style.overflow='hidden';
  $$('[data-close]',ov).forEach(b=>b.onclick=closeSheet);
  if(!noSave)$('#sheetSave').onclick=()=>{if(onSave()!==false)closeSheet()};
  if(onMount)onMount(ov);
}
function closeSheet(){const ov=$('#sheet');ov.classList.remove('open');ov.innerHTML='';document.body.style.overflow=''}
function confirmBox(title,msg,okLabel,onOk){
  const d=$('#dialog');
  d.innerHTML=`<div class="box" role="alertdialog"><p><b>${esc(title)}</b>${esc(msg)}</p><div class="dbtns"><button data-no>إلغاء</button><button class="red" data-ok>${esc(okLabel)}</button></div></div>`;
  d.classList.add('open');
  $('[data-no]',d).onclick=()=>d.classList.remove('open');
  $('[data-ok]',d).onclick=()=>{d.classList.remove('open');onOk()};
}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
const walletOptions=(sel,none)=>(none?`<option value="">${none}</option>`:'')+S.wallets.map(w=>`<option value="${w.id}" ${w.id===sel?'selected':''}>${esc(w.icon)} ${esc(w.name)}</option>`).join('');

/* ----- wallet sheet ----- */
function walletSheet(id){
  const w=id?walletById(id):null;
  const d=w?{...w}:{name:'',type:'حساب بنكي',icon:'🏦',color:COLORS[S.wallets.length%COLORS.length],initial:0};
  const bal=w?balances()[w.id]:0;const count=w?S.txs.filter(t=>t.walletId===w.id||t.toWalletId===w.id).length:0;
  const icons=['🏦','💵','💳','📱','🐷','📈','👛','🏠','✈️','🎯'];
  openSheet({title:w?'تعديل المحفظة':'محفظة جديدة',body:`
    ${w?`<div class="amount-in"><span>الرصيد الحالي</span><div style="font-size:30px;font-weight:700" class="${bal<0?'neg':''}">${money(bal)}</div><span>${fmtN(count,false)} معاملة مرتبطة</span></div>`:''}
    <div class="field-group">
      <div class="field"><label for="wn">الاسم</label><input id="wn" value="${esc(d.name)}" placeholder="مثال: الحساب الجاري" maxlength="40"></div>
      <div class="field"><label for="wt">النوع</label><select id="wt">${WTYPES.map(t=>`<option ${t.n===d.type?'selected':''}>${t.n}</option>`).join('')}</select></div>
      <div class="field"><label for="wi">الرصيد الافتتاحي</label><input id="wi" inputmode="decimal" value="${d.initial||''}" placeholder="0" style="direction:ltr;text-align:end"></div>
    </div>
    <div class="note">الرصيد الافتتاحي هو المبلغ قبل أول معاملة مسجّلة. لبطاقة الائتمان أدخل المبلغ المستحق بالسالب.</div>
    <div class="flabel">الأيقونة</div><div class="field-group" style="margin:0"><div class="emojis">${icons.map(i=>`<button class="em ${i===d.icon?'on':''}" data-i="${i}">${i}</button>`).join('')}</div></div>
    <div class="flabel">اللون</div><div class="field-group" style="margin:0"><div class="swatches">${COLORS.map(c=>`<button class="sw ${c===d.color?'on':''}" data-c="${c}" style="background:${c}" aria-label="لون"></button>`).join('')}</div></div>
    ${w?`<div class="btns"><button class="btn ghost block" id="wtx">عرض معاملات المحفظة</button><button class="btn danger block" id="wdel">حذف المحفظة</button></div>`:''}`,
    onMount(ov){
      $('#wt',ov).onchange=e=>{const t=WTYPES.find(x=>x.n===e.target.value);if(t){d.icon=t.i;$$('.em',ov).forEach(b=>b.classList.toggle('on',b.dataset.i===d.icon))}};
      $$('.em',ov).forEach(b=>b.onclick=()=>{d.icon=b.dataset.i;$$('.em',ov).forEach(x=>x.classList.toggle('on',x===b))});
      $$('.sw',ov).forEach(b=>b.onclick=()=>{d.color=b.dataset.c;$$('.sw',ov).forEach(x=>x.classList.toggle('on',x===b))});
      if(w){
        $('#wtx',ov).onclick=()=>{closeSheet();Object.assign(F,{q:'',type:'all',cat:'',month:'',wallet:w.id});go('tx')};
        $('#wdel',ov).onclick=()=>confirmBox('حذف المحفظة؟',count?`سيتم حذف ${count} معاملة مرتبطة بها أيضًا.`:'لا يمكن التراجع عن هذا الإجراء.','حذف',()=>{
          const removed=S.txs.filter(t=>t.walletId===w.id||t.toWalletId===w.id).map(t=>t.id);
          S.debts.forEach(db=>db.payments.forEach(p=>{if(removed.includes(p.txId))p.txId=null}));
          S.txs=S.txs.filter(t=>!removed.includes(t.id));S.wallets=S.wallets.filter(x=>x.id!==w.id);
          if(F.wallet===w.id)F.wallet='';closeSheet();commit('حُذفت المحفظة')});
      }
    },
    onSave(){
      const name=$('#wn').value.trim();if(!name){toast('اكتب اسم المحفظة');return false}
      const init=$('#wi').value.trim()===''?0:toNum($('#wi').value);if(isNaN(init)){toast('الرصيد الافتتاحي غير صالح');return false}
      Object.assign(d,{name,type:$('#wt').value,initial:init});
      if(w)Object.assign(w,d);else S.wallets.push({id:uid(),...d});
      commit(w?'حُفظت التعديلات':'أُضيفت المحفظة');
    }
  });
}

/* ----- transaction sheet ----- */
function txSheet(id,presetType){
  if(!S.wallets.length){toast('أضف محفظة أولًا');return walletSheet()}
  const t=id?S.txs.find(x=>x.id===id):null;
  const d=t?{...t}:{type:presetType||'expense',amount:'',category:presetType==='income'?'راتب':'طعام',walletId:F.wallet||S.wallets[0].id,toWalletId:(S.wallets.find(w=>w.id!==(F.wallet||S.wallets[0].id))||{}).id||'',date:today(),note:''};
  const linked=t&&t.debtId?S.debts.find(x=>x.id===t.debtId):null;
  const body=()=>`
    ${linked?'':`<div class="seg" style="margin-top:6px">${[['expense','مصروف'],['income','دخل'],['transfer','تحويل']].map(([k,l])=>`<button class="${d.type===k?'on':''}" data-type="${k}">${l}</button>`).join('')}</div>`}
    <div class="amount-in"><span>المبلغ (${esc(cur())})</span><input id="ta" inputmode="decimal" placeholder="0" value="${d.amount}" style="color:${d.type==='income'?'var(--inc)':d.type==='expense'?'var(--exp)':'var(--tr)'}"></div>
    ${linked?`<div class="note">هذه المعاملة دفعة للدين «${esc(linked.name)}». تعديل المبلغ أو حذفها ينعكس على الدين.</div>`:''}
    ${d.type!=='transfer'?`<div class="flabel">التصنيف</div><div class="cats">${CATS[d.type].map(c=>`<button class="cat ${c.n===d.category?'on':''}" data-cat="${esc(c.n)}"><span class="e">${c.i}</span>${esc(c.n)}</button>`).join('')}</div>`:''}
    <div class="field-group">
      <div class="field"><label for="tw">${d.type==='transfer'?'من':'المحفظة'}</label><select id="tw">${walletOptions(d.walletId)}</select></div>
      ${d.type==='transfer'?`<div class="field"><label for="tw2">إلى</label><select id="tw2">${walletOptions(d.toWalletId)}</select></div>`:''}
      <div class="field"><label for="td">التاريخ</label><input id="td" type="date" value="${d.date}"></div>
      <div class="field"><label for="tn">الوصف</label><input id="tn" value="${esc(d.note)}" placeholder="اختياري" maxlength="60"></div>
    </div>
    ${t?`<div class="btns"><button class="btn danger block" id="tdel">حذف المعاملة</button></div>`:''}`;
  const grab=()=>{d.amount=$('#ta').value;d.walletId=$('#tw').value;if($('#tw2'))d.toWalletId=$('#tw2').value;d.date=$('#td').value||today();d.note=$('#tn').value};
  const mount=ov=>{
    $$('[data-type]',ov).forEach(b=>b.onclick=()=>{grab();d.type=b.dataset.type;if(d.type!=='transfer'&&!CATS[d.type].some(c=>c.n===d.category))d.category=CATS[d.type][0].n;
      if(d.type==='transfer'&&(!d.toWalletId||d.toWalletId===d.walletId))d.toWalletId=(S.wallets.find(w=>w.id!==d.walletId)||{}).id||'';
      $('.sheet-body',ov).innerHTML=body();mount(ov)});
    $$('[data-cat]',ov).forEach(b=>b.onclick=()=>{d.category=b.dataset.cat;$$('[data-cat]',ov).forEach(x=>x.classList.toggle('on',x===b))});
    if($('#tdel',ov))$('#tdel',ov).onclick=()=>confirmBox('حذف المعاملة؟',linked?'ستُحذف الدفعة المقابلة من الدين أيضًا.':'لا يمكن التراجع عن هذا الإجراء.','حذف',()=>{
      S.txs=S.txs.filter(x=>x.id!==t.id);if(linked)linked.payments=linked.payments.filter(p=>p.txId!==t.id);closeSheet();commit('حُذفت المعاملة')});
    if(!t)setTimeout(()=>$('#ta',ov)?.focus(),300);
  };
  openSheet({title:t?'تعديل المعاملة':(presetType==='transfer'?'تحويل بين المحافظ':'معاملة جديدة'),body:body(),onMount:mount,onSave(){
    grab();const amount=toNum(d.amount);
    if(!(amount>0)){toast('أدخل مبلغًا أكبر من صفر');return false}
    if(d.type==='transfer'){if(S.wallets.length<2){toast('تحتاج محفظتين على الأقل للتحويل');return false}if(d.walletId===d.toWalletId){toast('اختر محفظتين مختلفتين');return false}}
    const rec={id:t?t.id:uid(),type:d.type,amount,category:d.type==='transfer'?'':d.category,walletId:d.walletId,toWalletId:d.type==='transfer'?d.toWalletId:undefined,date:d.date,note:d.note.trim()};
    if(t?.debtId)rec.debtId=t.debtId;
    if(t){Object.keys(t).forEach(k=>delete t[k]);Object.assign(t,rec);if(linked){const p=linked.payments.find(p=>p.txId===t.id);if(p){p.amount=amount;p.date=d.date}}}
    else S.txs.push(rec);
    commit(t?'حُفظت التعديلات':'سُجّلت المعاملة');
  }});
}

/* ----- debt sheets ----- */
function debtForm(id){
  const x=id?S.debts.find(d=>d.id===id):null;
  const d=x?{...x}:{kind:'owe',name:'',party:'',total:'',installments:'',startDate:today(),dueDate:'',note:''};
  const body=()=>`
    <div class="seg" style="margin-top:6px"><button class="${d.kind==='owe'?'on':''}" data-k="owe">دين عليّ</button><button class="${d.kind==='lend'?'on':''}" data-k="lend">دين لي</button></div>
    <div class="field-group">
      <div class="field"><label for="dn">الاسم</label><input id="dn" value="${esc(d.name)}" placeholder="مثال: تمويل السيارة" maxlength="40"></div>
      <div class="field"><label for="dp">${d.kind==='owe'?'الدائن':'المدين'}</label><input id="dp" value="${esc(d.party)}" placeholder="جهة أو شخص" maxlength="40"></div>
      <div class="field"><label for="dt">القيمة الكلية</label><input id="dt" inputmode="decimal" value="${d.total}" placeholder="0" style="direction:ltr;text-align:end"></div>
    </div>
    <div class="field-group">
      <div class="field"><label for="di">عدد الأقساط</label><input id="di" inputmode="numeric" value="${d.installments||''}" placeholder="اتركه فارغًا لدفعة واحدة" style="text-align:start"></div>
      <div class="field"><label for="ds">تاريخ البدء</label><input id="ds" type="date" value="${d.startDate}"></div>
      <div class="field" id="dueRow" style="${+d.installments?'display:none':''}"><label for="dd">تاريخ الاستحقاق</label><input id="dd" type="date" value="${d.dueDate||''}"></div>
      <div class="field"><label for="dno">ملاحظة</label><input id="dno" value="${esc(d.note||'')}" placeholder="اختياري" maxlength="80"></div>
    </div>
    <div class="note" id="instHint"></div>
    ${x&&x.payments.length?`<div class="note">مسجّل ${fmtN(x.payments.length,false)} دفعة لهذا الدين، ولن تتأثر بالتعديل.</div>`:''}`;
  const grab=()=>{d.name=$('#dn').value;d.party=$('#dp').value;d.total=$('#dt').value;d.installments=$('#di').value;d.startDate=$('#ds').value||today();d.dueDate=$('#dd').value;d.note=$('#dno').value};
  const hint=()=>{const tot=toNum($('#dt').value),n=parseInt(toNum($('#di').value));
    $('#dueRow').style.display=n>0?'none':'';
    $('#instHint').innerHTML=tot>0&&n>0?`القسط الشهري ${money(tot/n)}، يبدأ من تاريخ البدء ويتكرر شهريًا.`:'بدون أقساط: يُعامل كدين بدفعة واحدة أو دفعات حرة حتى تاريخ الاستحقاق.'};
  const mount=ov=>{
    $$('[data-k]',ov).forEach(b=>b.onclick=()=>{grab();d.kind=b.dataset.k;$('.sheet-body',ov).innerHTML=body();mount(ov)});
    $('#dt',ov).oninput=hint;$('#di',ov).oninput=hint;hint();
  };
  openSheet({title:x?'تعديل الدين':'دين جديد',body:body(),onMount:mount,onSave(){
    grab();const total=toNum(d.total);const n=d.installments.trim()?parseInt(toNum(d.installments)):0;
    if(!d.name.trim()){toast('اكتب اسم الدين');return false}
    if(!(total>0)){toast('أدخل قيمة الدين');return false}
    if(isNaN(n)||n<0||n>600){toast('عدد الأقساط غير صالح');return false}
    const rec={kind:d.kind,name:d.name.trim(),party:d.party.trim(),total,installments:n,startDate:d.startDate,dueDate:n?'':d.dueDate,note:d.note.trim()};
    if(x)Object.assign(x,rec);else S.debts.push({id:uid(),payments:[],...rec});
    const target=x?x.id:null;commit(x?'حُفظت التعديلات':'أُضيف الدين');
    if(target)setTimeout(()=>debtDetail(target),50);
  }});
}
function debtDetail(id){
  const d=S.debts.find(x=>x.id===id);if(!d)return;const i=debtInfo(d);
  const pays=[...d.payments].sort((a,b)=>b.date.localeCompare(a.date));
  openSheet({title:d.name,noSave:true,body:`
    <div class="amount-in">
      <span>${d.kind==='owe'?'المتبقي عليك':'المتبقي لك'}${d.party?` · ${esc(d.party)}`:''}</span>
      <div style="font-size:34px;font-weight:700">${money(i.remaining)}</div>
      <div class="progress" style="margin:10px 0 6px"><i style="width:${i.pct}%;background:${i.done?'var(--inc)':'var(--accent)'}"></i></div>
      <span class="num">${fmtN(i.pct,false)}%</span> <span>مسدَّد</span>
    </div>
    <div class="dstats">
      <div class="tile"><div class="k">القيمة الكلية</div><div class="v">${money(i.total)}</div></div>
      <div class="tile"><div class="k">المدفوع</div><div class="v pos">${money(i.paid)}</div></div>
      ${i.n?`<div class="tile"><div class="k">القسط الشهري</div><div class="v">${money(i.inst)}</div></div>
      <div class="tile"><div class="k">الأقساط</div><div class="v"><span class="num">${fmtN(i.paidCount,false)} / ${fmtN(i.n,false)}</span></div></div>`:''}
      <div class="tile"><div class="k">${i.n?'القسط القادم':'الاستحقاق'}</div><div class="v" style="font-size:15px">${i.done?'—':dateStr(i.next)}</div></div>
      <div class="tile"><div class="k">الحالة</div><div class="v" style="font-size:14px">${debtBadge(i)}</div></div>
    </div>
    ${d.note?`<div class="note">${esc(d.note)}</div>`:''}
    <div class="btns">${i.done?'':`<button class="btn block" id="dpay">تسجيل دفعة</button>`}</div>
    <div class="flabel">سجل الدفعات</div>
    <div class="group">${pays.length?pays.map(p=>{const t=S.txs.find(x=>x.id===p.txId);const w=t?walletById(t.walletId):null;
      return `<div class="row"><div class="ic" style="background:var(--incSoft);font-size:16px">✓</div>
        <div class="grow"><div class="t1">${money(+p.amount)}</div><div class="t2">${dateStr(p.date)} · ${esc(w?w.name:'بدون محفظة')}</div></div>
        <button class="link" style="color:var(--exp)" data-delpay="${p.id}">حذف</button></div>`}).join('')
      :'<div class="empty">لم تُسجَّل دفعات بعد</div>'}</div>
    <div class="btns"><button class="btn ghost block" id="dedit">تعديل الدين</button><button class="btn danger block" id="ddel">حذف الدين</button></div>`,
    onMount(ov){
      if($('#dpay',ov))$('#dpay',ov).onclick=()=>paymentSheet(d.id);
      $('#dedit',ov).onclick=()=>debtForm(d.id);
      $('#ddel',ov).onclick=()=>confirmBox('حذف الدين؟','ستبقى معاملات الدفعات في سجل المعاملات دون ربط.','حذف',()=>{
        S.txs.forEach(t=>{if(t.debtId===d.id)delete t.debtId});S.debts=S.debts.filter(x=>x.id!==d.id);closeSheet();commit('حُذف الدين')});
      $$('[data-delpay]',ov).forEach(b=>b.onclick=()=>confirmBox('حذف الدفعة؟','ستُحذف المعاملة المرتبطة بها من المحفظة.','حذف',()=>{
        const p=d.payments.find(x=>x.id===b.dataset.delpay);d.payments=d.payments.filter(x=>x!==p);
        if(p&&p.txId)S.txs=S.txs.filter(t=>t.id!==p.txId);commit('حُذفت الدفعة');debtDetail(d.id)}));
    }});
}
function paymentSheet(id){
  const d=S.debts.find(x=>x.id===id);const i=debtInfo(d);
  const def=i.n?Math.min(i.inst,i.remaining):i.remaining;
  openSheet({title:'تسجيل دفعة',saveLabel:'تسجيل',body:`
    <div class="amount-in"><span>مبلغ الدفعة (${esc(cur())})</span><input id="pa" inputmode="decimal" value="${Math.round(def*100)/100}"><span>المتبقي ${money(i.remaining)}</span></div>
    <div class="field-group">
      <div class="field"><label for="pw">${d.kind==='owe'?'الدفع من':'الإيداع في'}</label><select id="pw">${walletOptions(S.wallets[0]?.id,'بدون ربط بمحفظة')}</select></div>
      <div class="field"><label for="pd">التاريخ</label><input id="pd" type="date" value="${today()}"></div>
    </div>
    <div class="note">عند اختيار محفظة تُسجَّل الدفعة تلقائيًا ${d.kind==='owe'?'كمصروف':'كدخل'} فيها.</div>`,
    onSave(){
      const amount=toNum($('#pa').value);if(!(amount>0)){toast('أدخل مبلغًا صحيحًا');return false}
      if(amount>i.remaining+0.01){toast('المبلغ أكبر من المتبقي');return false}
      const date=$('#pd').value||today();const walletId=$('#pw').value;let txId=null;
      if(walletId){const t={id:uid(),type:d.kind==='owe'?'expense':'income',amount,category:d.kind==='owe'?'سداد ديون':'تحصيل ديون',walletId,date,note:'دفعة: '+d.name,debtId:d.id};S.txs.push(t);txId=t.id}
      d.payments.push({id:uid(),amount,date,txId});
      commit('سُجّلت الدفعة');setTimeout(()=>debtDetail(d.id),50);
    }});
}

/* ----- settings ----- */

function settingsSheet(){
  const st={...S.settings};
  openSheet({title:'الإعدادات',body:`
    <div class="flabel">المظهر</div>
    <div class="seg">${[['auto','تلقائي'],['light','فاتح'],['dark','داكن']].map(([k,l])=>`<button class="${st.theme===k?'on':''}" data-th="${k}">${l}</button>`).join('')}</div>
    <div class="field-group">
      <div class="field"><label for="sc">العملة</label><input id="sc" value="${esc(st.currency)}" maxlength="6" placeholder="ر.س"></div>
      <div class="field"><label for="sb">الميزانية الشهرية</label><input id="sb" inputmode="decimal" value="${st.budget||''}" placeholder="0" style="direction:ltr;text-align:end"></div>
    </div>
    <div class="note">تُحفظ بياناتك على هذا الجهاز وفي هذا المتصفح فقط. صدّر نسخة احتياطية بانتظام.</div>
    <div class="flabel">النسخ الاحتياطي</div>
    <div class="btns" style="margin-top:0">
      <button class="btn block" id="sexp">حفظ نسخة احتياطية في الملفات</button>
      <button class="btn ghost block" id="sfilebtn">استعادة من ملف</button>
      <input type="file" id="sfile" accept=".json,application/json" hidden>
      <div class="note" style="margin:2px 4px 0">${S.settings.lastBackup?`آخر نسخة: ${dateStr(S.settings.lastBackup)}`:'لم تُحفظ أي نسخة بعد'}</div>
      <button class="btn ghost block" id="scopy">عرض البيانات للنسخ</button>
    </div>
    <textarea class="code" id="sjson" placeholder="الصق هنا نسخة احتياطية ثم اضغط استيراد" style="margin-top:10px"></textarea>
    <div class="btns" style="margin-top:8px"><button class="btn ghost block" id="simp">استيراد البيانات الملصقة</button></div>
    <div class="flabel">إدارة البيانات</div>
    <div class="btns" style="margin-top:0">
      <button class="btn ghost block" id="sdemo">تحميل بيانات تجريبية</button>
      <button class="btn danger block" id="sclear">مسح جميع البيانات</button>
    </div>`,
    onMount(ov){
      $$('[data-th]',ov).forEach(b=>b.onclick=()=>{st.theme=b.dataset.th;$$('[data-th]',ov).forEach(x=>x.classList.toggle('on',x===b));applyTheme(st.theme)});
      const dump=()=>JSON.stringify(S,null,1);
      const markBackup=()=>{S.settings.lastBackup=today();save()};
      $('#sexp',ov).onclick=async()=>{
        const name=`mizan-backup-${today()}.json`;const data=dump();
        try{
          const file=new File([data],name,{type:'application/json'});
          if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});markBackup();closeSheet();render();toast('حُفظت النسخة الاحتياطية');return}
        }catch(e){if(e&&e.name==='AbortError')return}
        try{const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);markBackup();closeSheet();render();toast('حُفظت النسخة الاحتياطية')}
        catch(e){toast('تعذّر الحفظ، استخدم «عرض البيانات للنسخ»')}
      };
      const doImport=txt=>{let d;try{d=JSON.parse(txt)}catch(e){toast('الملف ليس نسخة احتياطية صالحة');return}
        if(!d||!Array.isArray(d.wallets)){toast('الملف ليس نسخة احتياطية صالحة');return}
        confirmBox('استعادة البيانات؟','ستُستبدل بياناتك الحالية بالكامل.','استعادة',()=>{S=normalize(d);applyTheme(S.settings.theme);closeSheet();commit('اكتملت الاستعادة')})};
      $('#sfilebtn',ov).onclick=()=>$('#sfile',ov).click();
      $('#sfile',ov).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(f);e.target.value=''};
      $('#scopy',ov).onclick=()=>{const ta=$('#sjson',ov);ta.value=dump();ta.focus();ta.select();try{navigator.clipboard.writeText(ta.value).then(()=>toast('نُسخت البيانات'),()=>{})}catch(e){}};
      $('#simp',ov).onclick=()=>doImport($('#sjson',ov).value);
      $('#sdemo',ov).onclick=()=>confirmBox('تحميل بيانات تجريبية؟','ستُستبدل بياناتك الحالية.','تحميل',()=>{const cur=S.settings;S=seed();S.settings.theme=cur.theme;closeSheet();commit('حُمّلت البيانات التجريبية')});
      $('#sclear',ov).onclick=()=>confirmBox('مسح جميع البيانات؟','ستُحذف المحافظ والمعاملات والديون نهائيًا.','مسح',()=>{const th=S.settings.theme,c=S.settings.currency;S=blank();S.settings.theme=th;S.settings.currency=c;closeSheet();commit('مُسحت البيانات')});
    },
    onSave(){
      const b=$('#sb').value.trim()?toNum($('#sb').value):0;if(isNaN(b)||b<0){toast('الميزانية غير صالحة');return false}
      S.settings={...S.settings,theme:st.theme,currency:$('#sc').value.trim()||'ر.س',budget:b};
      commit('حُفظت الإعدادات');
    }});
}

/* ============ theme ============ */
function applyTheme(t){
  const r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');
  setTimeout(()=>{const m=document.getElementById('themeColor');if(m)m.setAttribute('content',cssv('--bg')||'#F2F2F7')},0);
  if(tab==='reports')setTimeout(renderReports,30);
}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme(S.settings.theme)})}catch(e){}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tab');if(tb){go(tb.dataset.tab);return}
  const el=e.target.closest('[data-act]');if(!el||el.closest('#sheet'))return;
  const a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'new-tx':txSheet();break;
    case 'new-transfer':txSheet(null,'transfer');break;
    case 'tx':txSheet(id);break;
    case 'new-wallet':walletSheet();break;
    case 'wallet':walletSheet(id);break;
    case 'settings':settingsSheet();break;
    case 'goto-tx':Object.assign(F,{q:'',type:'all',cat:'',wallet:'',month:''});go('tx');break;
    case 'month':{const n=shiftMonth(homeMonth,+el.dataset.d);if(n<=curMonth()){homeMonth=n;renderHome()}break}
    case 'ftype':F.type=el.dataset.k;renderTxResults();break;
    case 'clear-filters':Object.assign(F,{q:'',type:'all',cat:'',wallet:'',month:''});renderTx();break;
    case 'new-debt':debtForm();break;
    case 'debt':debtDetail(id);break;
    case 'dfilter':debtFilter=el.dataset.k;renderDebts();break;
    case 'range':reportRange=+el.dataset.k;renderReports();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#dialog').classList.contains('open'))$('#dialog').classList.remove('open');else if($('#sheet').classList.contains('open'))closeSheet()}});

/* ============ boot ============ */
S=load();if(!S.settings.firstUse)S.settings.firstUse=today();save();applyTheme(S.settings.theme);render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
